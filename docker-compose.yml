# Запуск на сервере: PostgreSQL, сайт на gunicorn и Caddy с HTTPS.
# Настройки — в файле .env рядом (образец: .env.example).
#   docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./NIS
      args:
        ASSET_VERSION: ${ASSET_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - media_data:/app/media
      - private_media:/app/private_media
      # Проверка задач на код запускает решения соседними контейнерами.
      # Доступ к сокету равносилен правам root на хосте
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pg_data:
  media_data:
  private_media:
  caddy_data:
  caddy_config:
