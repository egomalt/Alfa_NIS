# Запуск на сервере: PostgreSQL, сайт на gunicorn и Caddy с HTTPS.
# Настройки — в файле .env рядом (образец: .env.example).
#   docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./NIS
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: db
      BEHIND_PROXY: "1"
    volumes:
      - media_data:/app/media
      - private_media:/app/private_media
      # Проверка задач на код запускает решения соседними контейнерами.
      # Доступ к сокету равносилен правам root на хосте
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pg_data:
  media_data:
  private_media:
  caddy_data:
  caddy_config:
