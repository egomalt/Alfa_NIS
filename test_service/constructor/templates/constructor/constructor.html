{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script>
        (function () {
            var storageKey = 'forum_theme';
            var theme = 'light';
            try {
                var savedTheme = localStorage.getItem(storageKey);
                if (savedTheme === 'dark' || savedTheme === 'light') {
                    theme = savedTheme;
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            } catch (error) {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <title>Alfa Career — Конструктор тестов</title>
    <link rel="stylesheet" href="{% static 'main/styles.css' %}?v=20260421-3">
    <script>
        window.ALFA_APP_BOOTSTRAP = {
            path: "{{ app_path|escapejs }}",
            page: "constructor"
        };
    </script>
    <script src="{% static 'main/theme.js' %}?v=20260421-3" defer></script>
    <script type="module" src="{% static 'constructor/app.js' %}?v=20260421-3"></script>
</head>
<body class="app-runtime-body">
    <div class="home-shell">
        <header class="home-topbar">
            <a href="/" class="landing-brand home-brand"><span class="brand-mark"></span><span>Alfa Career</span></a>
            <nav class="home-nav">
                <button type="button" class="theme-toggle" data-theme-toggle>Тёмная тема</button>
            </nav>
        </header>
        <main class="home-placeholder">
            <div class="home-placeholder-card">
                <div class="eyebrow-text">Конструктор</div>
                <h1>Конструктор тестов</h1>
                <p>Здесь будет конструктор для создания и редактирования тестов. Раздел находится в разработке.</p>
            </div>
        </main>
    </div>
</body>
</html>
