{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <title>Тренировочные тесты — Career</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600;700;800&display=swap">
  <style>
:root {
  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --surface-2: #EDF0F6;
  --line: #E2E7F0;
  --line-2: #D2D9E6;
  --text: #161A22;
  --text-2: #3C434F;
  --muted: #6E7787;
  --faint: #99A2B2;
  --brand: #D62839;
  --brand-strong: #BC1F2F;
  --brand-text: #C81E2D;
  --brand-soft: #FCE7E8;
  --on-brand: #FFFFFF;
  --green-text: #15935A;
  --green-soft: #E2F3EA;
  --amber-soft: #FBEEDA;
  --amber-text: #B7770C;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 18px rgba(16,24,40,.06);
}
[data-theme="dark"] {
  --bg: #0E1117;
  --surface: #161B23;
  --surface-2: #1D2330;
  --line: #262D3A;
  --line-2: #333C4B;
  --text: #E8EBF1;
  --text-2: #B7BFCD;
  --muted: #838C9C;
  --faint: #5E6573;
  --brand: #E63E4B;
  --brand-strong: #EC5460;
  --brand-text: #FF8A92;
  --brand-soft: rgba(230,62,75,.17);
  --on-brand: #FFFFFF;
  --green-text: #5FCF97;
  --green-soft: rgba(43,168,106,.16);
  --amber-soft: rgba(215,154,58,.16);
  --amber-text: #F0C070;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.36);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Onest', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
input, textarea, select, button { font-family: inherit; }

/* ── Navbar ── */
.navbar {
  height: 64px;
  display: flex; align-items: center; gap: 0;
  padding: 0 32px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 50;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--text);
  margin-right: 32px;
}
.logo-icon {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--brand);
}
.logo-text { font-weight: 800; font-size: 16.5px; letter-spacing: -.01em; }
.nav-links { display: flex; align-items: center; gap: 4px; flex: 1; }
.nav-link {
  display: flex; align-items: center;
  height: 40px; padding: 0 14px;
  font-size: 14px; font-weight: 500;
  color: var(--text-2); text-decoration: none;
  border-radius: 9px;
  transition: background .12s, color .12s;
  cursor: pointer; border: none; background: transparent;
}
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link.active { background: var(--surface-2); color: var(--text); font-weight: 600; }
.nav-right { display: flex; align-items: center; gap: 10px; }
.btn-theme {
  height: 36px; width: 36px;
  border: 1px solid var(--line); border-radius: 9px;
  background: var(--surface); color: var(--text-2);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: color .15s;
}
.btn-theme:hover { color: var(--text); }
.user-chip {
  display: flex; align-items: center; gap: 9px;
  height: 36px; padding: 0 12px 0 8px;
  border: 1px solid var(--line); border-radius: 9px;
  background: var(--surface); cursor: pointer;
  text-decoration: none; color: var(--text);
  transition: background .12s;
}
.user-chip:hover { background: var(--surface-2); }
.user-avatar {
  width: 24px; height: 24px; border-radius: 6px;
  background: var(--brand-soft); color: var(--brand-text);
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-name { font-size: 13px; font-weight: 600; }
.user-role { font-size: 11px; color: var(--muted); }

/* ── Main ── */
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 32px 80px;
}
.page-header {
  display: flex; align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 28px; gap: 16px; flex-wrap: wrap;
}
.page-title { font-size: 28px; font-weight: 800; letter-spacing: -.025em; margin-bottom: 5px; }
.page-subtitle { font-size: 15px; color: var(--muted); }
.btn-create {
  display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 18px;
  border: none; border-radius: 10px;
  background: var(--brand); color: var(--on-brand);
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: background .15s; flex-shrink: 0;
  text-decoration: none;
}
.btn-create:hover { background: var(--brand-strong); }

/* ── Filters ── */
.filters {
  display: flex; align-items: center; gap: 20px;
  margin-bottom: 26px; flex-wrap: wrap;
}
.filter-group { display: flex; align-items: center; gap: 6px; }
.filter-label {
  font-size: 12.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em;
  color: var(--faint); margin-right: 4px; white-space: nowrap;
}
.filter-divider { height: 20px; width: 1px; background: var(--line); }
.tab-btn {
  height: 30px; padding: 0 12px;
  border: 1px solid var(--line-2); border-radius: 8px;
  background: var(--surface); color: var(--text-2);
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all .12s; white-space: nowrap;
}
.tab-btn:hover { opacity: .85; }
.tab-btn.active { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; color: var(--muted);
  margin-left: auto;
}

/* ── Grid ── */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
@media (max-width: 900px) { .grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 580px) { .grid { grid-template-columns: 1fr; } }

.card {
  display: flex; flex-direction: column;
  padding: 22px;
  border: 1px solid var(--line); border-radius: 16px;
  background: var(--surface);
  transition: border-color .15s, box-shadow .15s;
}
.card:hover { border-color: var(--line-2); box-shadow: var(--shadow); }

.card-header { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
.card-company-icon {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--brand-soft); color: var(--brand-text);
  font-weight: 700; font-size: 13px; flex-shrink: 0;
}
.card-company { font-size: 12.5px; color: var(--muted); }
.card-level {
  margin-left: auto;
  font-size: 11.5px; font-weight: 600;
  padding: 3px 9px; border-radius: 6px;
}
.card-title { font-size: 15.5px; font-weight: 700; line-height: 1.3; margin-bottom: 7px; }
.card-desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 16px; flex: 1; }
.card-footer {
  display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 14px;
}
.card-questions {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; color: var(--faint);
}
.card-category {
  font-size: 12px; font-weight: 500;
  padding: 3px 9px; border: 1px solid var(--line);
  border-radius: 999px; background: var(--bg); color: var(--text-2);
}
.btn-start {
  height: 38px; width: 100%;
  border: 1px solid var(--line-2); border-radius: 9px;
  background: var(--surface); color: var(--text);
  font-size: 13.5px; font-weight: 600; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
  text-decoration: none;
  display: flex; align-items: center; justify-content: center;
}
.btn-start:hover { background: var(--brand); color: var(--on-brand); border-color: transparent; }

/* ── Empty ── */
.empty {
  grid-column: 1/-1;
  padding: 60px; text-align: center;
  border: 2px dashed var(--line-2); border-radius: 16px;
}
.empty-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.empty-sub { font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>

<!-- ── Navbar ── -->
<nav class="navbar">
  <a href="/" class="logo">
    <span class="logo-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff">
        <rect x="3.5" y="13" width="4.3" height="8" rx="1.4"/>
        <rect x="9.85" y="8" width="4.3" height="13" rx="1.4"/>
        <rect x="16.2" y="3" width="4.3" height="18" rx="1.4"/>
      </svg>
    </span>
    <span class="logo-text">Career</span>
  </a>
  <div class="nav-links">
    <a href="/" class="nav-link">Главная</a>
    <a href="/companies/" class="nav-link">Компании</a>
    <a href="/articles/" class="nav-link">Статьи</a>
    <button class="nav-link active" onclick="void(0)">Тесты</button>
  </div>
  <div class="nav-right">
    <button class="btn-theme" data-theme-toggle>
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/>
      </svg>
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
    <div id="nav-user-chip"></div>
  </div>
</nav>

<!-- ── Main ── -->
<main>
  <div class="page-header">
    <div>
      <div class="page-title">Тренировочные тесты</div>
      <div class="page-subtitle">Готовьтесь по реальным заданиям работодателей</div>
    </div>
    <a href="/constructor/" class="btn-create" id="btn-create" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Создать тест
    </a>
  </div>

  <!-- Filters -->
  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">Уровень</span>
      <button class="tab-btn active" data-level="all">Все</button>
      <button class="tab-btn" data-level="junior">Junior</button>
      <button class="tab-btn" data-level="middle">Middle</button>
      <button class="tab-btn" data-level="senior">Senior</button>
    </div>
    <div class="filter-divider"></div>
    <div class="filter-group" style="flex-wrap:wrap;">
      <span class="filter-label">Категория</span>
      <button class="tab-btn active" data-cat="all">Все</button>
      <button class="tab-btn" data-cat="frontend">Frontend</button>
      <button class="tab-btn" data-cat="backend">Backend</button>
      <button class="tab-btn" data-cat="devops">DevOps</button>
      <button class="tab-btn" data-cat="analytics">Аналитика</button>
    </div>
    <span class="count" id="count"></span>
  </div>

  <!-- Grid -->
  <div class="grid" id="grid">
    <div class="empty">
      <div class="empty-title">Загрузка…</div>
    </div>
  </div>
</main>

<style>
  /* theme icon visibility — matches theme.js logic */
  [data-theme="dark"] .icon-moon { display: none; }
  [data-theme="light"] .icon-sun { display: none; }
</style>
<script src="{% static 'main/theme.js' %}" defer></script>
<script>
(function () {
  const LEVEL_COLORS = {
    junior: { bg:'var(--green-soft)', color:'var(--green-text)' },
    middle: { bg:'var(--amber-soft)', color:'var(--amber-text)' },
    senior: { bg:'var(--brand-soft)', color:'var(--brand-text)' },
  };

  const CAT_LABELS = {
    frontend: 'Frontend', backend: 'Backend',
    devops: 'DevOps', analytics: 'Аналитика', other: 'Другое',
  };

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function pluralQ(n) {
    if (n % 10 === 1 && n % 100 !== 11) return n + ' вопрос';
    if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return n + ' вопроса';
    return n + ' вопросов';
  }

  function pluralT(n) {
    if (n % 10 === 1 && n % 100 !== 11) return n + ' тест';
    if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return n + ' теста';
    return n + ' тестов';
  }

  let allTests = [];
  let activeLevel = 'all';
  let activeCat   = 'all';

  function filtered() {
    return allTests.filter(t =>
      (activeLevel === 'all' || t.level === activeLevel) &&
      (activeCat   === 'all' || t.category === activeCat)
    );
  }

  function render() {
    const list = filtered();
    document.getElementById('count').textContent = list.length ? pluralT(list.length) : '';
    const grid = document.getElementById('grid');

    if (!list.length) {
      grid.innerHTML = `
        <div class="empty">
          <div class="empty-title">Тестов не найдено</div>
          <div class="empty-sub">Попробуйте изменить фильтры</div>
        </div>`;
      return;
    }

    grid.innerHTML = list.map(t => {
      const initial = esc((t.owner_name || t.owner_username || '?')[0].toUpperCase());
      const lc = LEVEL_COLORS[t.level] || null;
      const levelBadge = lc && t.level
        ? `<span class="card-level" style="background:${lc.bg};color:${lc.color};">${esc({junior:'Junior',middle:'Middle',senior:'Senior'}[t.level]||t.level)}</span>`
        : '';
      const catLabel = CAT_LABELS[t.category] || t.category || '';
      return `
        <div class="card">
          <div class="card-header">
            <span class="card-company-icon">${initial}</span>
            <span class="card-company">${esc(t.owner_name || t.owner_username)}</span>
            ${levelBadge}
          </div>
          <div class="card-title">${esc(t.title)}</div>
          ${t.description ? `<div class="card-desc">${esc(t.description)}</div>` : '<div class="card-desc"></div>'}
          <div class="card-footer">
            <span class="card-questions">${pluralQ(t.page_count)}</span>
            ${catLabel ? `<span class="card-category">${esc(catLabel)}</span>` : ''}
          </div>
          <a href="${esc(t.url)}" class="btn-start">Начать тест</a>
        </div>`;
    }).join('');
  }

  // Filter tabs — level
  document.querySelectorAll('[data-level]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeLevel = btn.dataset.level;
      document.querySelectorAll('[data-level]').forEach(b => b.classList.toggle('active', b === btn));
      render();
    });
  });

  // Filter tabs — category
  document.querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCat = btn.dataset.cat;
      document.querySelectorAll('[data-cat]').forEach(b => b.classList.toggle('active', b === btn));
      render();
    });
  });

  // User chip + create button
  fetch('/api/v1/auth/me/')
    .then(r => r.json())
    .then(data => {
      const chip = document.getElementById('nav-user-chip');
      if (!data.ok || !data.account) {
        const next = encodeURIComponent(location.pathname);
        chip.innerHTML = `
          <a href="/authorization/signin/?next=${next}" style="display:inline-flex;align-items:center;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:500;color:var(--text);text-decoration:none;background:var(--surface);">Войти</a>
          <a href="/authorization/signup/?next=${next}" style="display:inline-flex;align-items:center;height:34px;padding:0 13px;border:1px solid transparent;border-radius:8px;font-size:13px;font-weight:500;color:#fff;text-decoration:none;background:var(--brand);">Регистрация</a>`;
        return;
      }
      const a = data.account;
      const avatarInner = a.avatar
        ? `<img src="${esc(a.avatar)}" alt="">`
        : esc((a.name||a.username||'?')[0].toUpperCase());
      chip.innerHTML = `
        <a href="${esc(a.profile_url)}" class="user-chip">
          <span class="user-avatar">${avatarInner}</span>
          <div>
            <div class="user-name">${esc(a.name||a.username)}</div>
            <div class="user-role">${a.role==='company'?'Компания':'Кандидат'}</div>
          </div>
        </a>`;
      if (a.role === 'company') {
        const btn = document.getElementById('btn-create');
        if (btn) btn.hidden = false;
      }
    })
    .catch(() => {});

  // Load tests
  fetch('/api/v1/tests/catalog/')
    .then(r => r.json())
    .then(data => {
      if (!data.ok) throw new Error();
      allTests = data.tests || [];
      render();
    })
    .catch(() => {
      document.getElementById('grid').innerHTML = `
        <div class="empty">
          <div class="empty-title">Не удалось загрузить тесты</div>
          <div class="empty-sub">Попробуйте обновить страницу</div>
        </div>`;
    });
})();
</script>
</body>
</html>
