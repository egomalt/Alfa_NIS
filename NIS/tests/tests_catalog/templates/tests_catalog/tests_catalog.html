{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script>(function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();</script>
  <title>Тренировочные тесты — Career</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{% static 'css/career.css' %}">
  <link rel="stylesheet" href="{% static 'tests_catalog/css/app.css' %}">
  <script src="{% static 'main/theme.js' %}" defer></script>
  <script src="{% static 'js/career.js' %}?v=20260613-1" defer></script>
  <script src="{% static 'tests_catalog/js/app.js' %}" defer></script>
</head>
<body>

<header class="cr-navbar">
  <a href="/" class="cr-brand">
    <span class="cr-brand-mark">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><rect x="3.5" y="13" width="4.3" height="8" rx="1.4"/><rect x="9.85" y="8" width="4.3" height="13" rx="1.4"/><rect x="16.2" y="3" width="4.3" height="18" rx="1.4"/></svg>
    </span>
    <span class="cr-brand-name">Career</span>
  </a>
  <nav class="cr-nav">
    <a href="/" class="cr-nav-link">Главная</a>
    <a href="/companies/" class="cr-nav-link">Компании</a>
    <a href="/articles/" class="cr-nav-link">Статьи</a>
    <a href="/tests/" class="cr-nav-link active">Тесты</a>
  </nav>
  <div class="cr-navbar-spacer"></div>
  <button type="button" data-theme-toggle class="cr-theme-btn">
    <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
    <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <div id="tests-catalog-user-chip" data-user-chip>
    <a href="/authorization/signin/" class="mini-link-button">Войти</a>
    <a href="/authorization/signup/" class="mini-link-button" style="background:var(--brand);color:var(--on-brand);border-color:transparent;">Регистрация</a>
  </div>
</header>

<main>
  <div class="page-header">
    <div>
      <div class="page-title">Тренировочные тесты</div>
      <div class="page-subtitle">Готовьтесь по реальным заданиям работодателей</div>
    </div>
    <a href="/constructor/" class="btn-create" id="btn-create" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Создать тест
    </a>
  </div>

  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">Уровень</span>
      <button class="tab-btn active" data-level="all">Все</button>
      <button class="tab-btn" data-level="junior">Junior</button>
      <button class="tab-btn" data-level="middle">Middle</button>
      <button class="tab-btn" data-level="senior">Senior</button>
    </div>
    <div class="filter-divider"></div>
    <div class="filter-group" style="flex-wrap:wrap;">
      <span class="filter-label">Категория</span>
      <button class="tab-btn active" data-cat="all">Все</button>
      <button class="tab-btn" data-cat="frontend">Frontend</button>
      <button class="tab-btn" data-cat="backend">Backend</button>
      <button class="tab-btn" data-cat="devops">DevOps</button>
      <button class="tab-btn" data-cat="analytics">Аналитика</button>
    </div>
    <span class="count" id="count"></span>
  </div>

  <div class="grid" id="grid">
    <div class="empty"><div class="empty-title">Загрузка…</div></div>
  </div>
</main>

</body>
</html>
