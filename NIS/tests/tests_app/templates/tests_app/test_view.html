{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script>
    (function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <title>Alfa Career — {{ test_title|default:"Тест" }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{% static 'css/career.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    window.ALFA_APP_BOOTSTRAP = {
      path: "{{ app_path|escapejs }}",
      testId: {{ test_id }},
      isPreview: {% if is_preview %}true{% else %}false{% endif %},
      page: "test_view"
    };
  </script>
  <script src="{% static 'main/theme.js' %}" defer></script>
  <script type="module" src="{% static 'main/test_view/app.js' %}?v=20260608-4"></script>
</head>
<body>
<div class="tv-layout" id="tv-root">

  <header class="tv-topbar">
    <a href="/" class="tv-brand">
      <span class="brand-mark" style="width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><rect x="3.5" y="13" width="4.3" height="8" rx="1.4"/><rect x="9.85" y="8" width="4.3" height="13" rx="1.4"/><rect x="16.2" y="3" width="4.3" height="18" rx="1.4"/></svg>
      </span>
      <span>Career</span>
    </a>

    <span id="tv-test-title" class="tv-test-title"></span>
    <span id="tv-preview-badge" class="tv-preview-badge" hidden>Предпросмотр</span>
    <a id="tv-back-to-editor" href="#" class="tv-back-btn" hidden>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
      В редактор
    </a>
    <button type="button" data-theme-toggle class="tv-btn" style="border:none;background:transparent;color:var(--muted);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </header>

  <div class="tv-body">
    <nav class="tv-sidebar" id="tv-sidebar"></nav>
    <main class="tv-main">
      <div class="tv-inner" id="tv-main-inner">
        <div class="tv-loading">Загрузка теста…</div>
      </div>
    </main>
  </div>

</div>
</body>
</html>
