{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script>
        (function () {
            var storageKey = 'alfa_theme';
            var theme = 'light';
            try {
                var savedTheme = localStorage.getItem(storageKey);
                if (savedTheme === 'dark' || savedTheme === 'light') {
                    theme = savedTheme;
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            } catch (error) {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <title>Alfa Career — {{ test_title|default:"Тест" }}</title>
    <link rel="stylesheet" href="{% static 'main/styles.css' %}?v=20260421-3">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .tv-layout { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .tv-topbar { display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 56px; border-bottom: 1px solid var(--line); flex-shrink: 0; background: var(--bg); }
        .tv-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; text-decoration: none; color: var(--text); }
        .tv-test-title { flex: 1; font-size: 0.95rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .tv-preview-badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; background: #e6a817; color: #fff; font-weight: 600; flex-shrink: 0; }
        .tv-body { display: flex; flex: 1; overflow: hidden; }
        .tv-sidebar { width: 220px; flex-shrink: 0; border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 0; background: var(--surface); }
        .tv-nav-item { display: flex; align-items: center; gap: 8px; padding: 8px 14px; cursor: pointer; font-size: 0.82rem; color: var(--text); border-left: 2px solid transparent; transition: background .1s; }
        .tv-nav-item:hover { background: var(--surface-alt); }
        .tv-nav-item.active { border-left-color: var(--text); background: var(--surface-alt); font-weight: 500; }
        .tv-nav-item.answered { color: var(--muted); }
        .tv-nav-num { font-size: 0.72rem; color: var(--muted); width: 18px; flex-shrink: 0; text-align: right; }
        .tv-nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tv-main { flex: 1; overflow-y: auto; padding: 40px 20px; display: flex; justify-content: center; }
        .tv-inner { width: 100%; max-width: 680px; }
        .tv-page-content { font-size: 0.92rem; line-height: 1.7; margin-bottom: 24px; }
        .tv-page-content h1, .tv-page-content h2, .tv-page-content h3 { margin: .5em 0; }
        .tv-page-content p { margin: .4em 0; }
        .tv-question { font-size: 1.05rem; font-weight: 600; margin-bottom: 18px; }
        .tv-answers { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
        .tv-answer-label { display: flex !important; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: normal; margin-bottom: 0; transition: background .1s, border-color .1s; }
        .tv-answer-label:hover { border-color: var(--text); background: var(--surface-alt); }
        .tv-answer-label.selected { border-color: var(--text); background: var(--surface-alt); }
        .tv-answer-label.correct { border-color: #38a169; background: rgba(56,161,105,.08); color: #38a169; }
        .tv-answer-label.incorrect { border-color: #e53e3e; background: rgba(229,62,62,.06); color: #e53e3e; text-decoration: line-through; }
        .tv-input-field { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 0.92rem; box-sizing: border-box; font-family: inherit; }
        .tv-input-field:focus { outline: none; border-color: var(--text); }
        .tv-input-field.correct { border-color: #38a169; }
        .tv-input-field.incorrect { border-color: #e53e3e; }
        .tv-input-hint { font-size: 0.8rem; margin-top: 6px; }
        .tv-input-hint.correct { color: #38a169; }
        .tv-input-hint.incorrect { color: #e53e3e; }
        .tv-nav-btns { display: flex; gap: 10px; margin-top: 8px; }
        .tv-btn { padding: 10px 20px; border-radius: 10px; font-size: 0.88rem; font-weight: 700; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--text); transition: opacity .15s; }
        .tv-btn:hover { opacity: 0.8; }
        .tv-btn-primary { background: var(--accent-bg); color: var(--accent-text); border-color: transparent; }
        .tv-btn:disabled { opacity: 0.35; cursor: default; }
        .tv-back-btn { padding: 6px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--text); flex-shrink: 0; }
        .tv-results { text-align: center; padding: 32px 0; }
        .tv-score-circle { display: inline-flex; align-items: center; justify-content: center; width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--text); font-size: 1.6rem; font-weight: 700; margin-bottom: 16px; }
        .tv-score-circle.pass { border-color: #38a169; color: #38a169; }
        .tv-score-circle.fail { border-color: #e53e3e; color: #e53e3e; }
        .tv-result-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        .tv-result-sub { color: var(--muted); margin-bottom: 24px; }
        .tv-result-items { text-align: left; display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
        .tv-result-item { padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; border: 1px solid; }
        .tv-result-item.correct { border-color: #38a169; background: rgba(56,161,105,.06); }
        .tv-result-item.incorrect { border-color: #e53e3e; background: rgba(229,62,62,.04); }
        .tv-result-item-title { font-weight: 500; margin-bottom: 4px; }
        .tv-result-item-hint { color: var(--muted); font-size: 0.8rem; }
        .tv-loading { text-align: center; padding: 80px 20px; color: var(--muted); }
        .tv-code-textarea { width: 100%; min-height: 320px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-family: 'Consolas','Fira Mono','Menlo',monospace; font-size: 0.88rem; line-height: 1.6; resize: vertical; box-sizing: border-box; tab-size: 4; }
        .tv-code-textarea:focus { outline: none; border-color: var(--text); }
        .tv-code-lang-badge { font-size: 0.72rem; padding: 3px 10px; border-radius: 10px; background: rgba(37,99,235,.12); color: #2563eb; font-weight: 600; }
        .tv-upload-label { font-size: 0.8rem; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; user-select: none; }
        .tv-upload-label:hover { background: var(--surface-alt); }
        .tv-code-results-wrap { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
        .tv-code-results-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 0.88rem; background: var(--surface-alt); }
        .tv-code-verdict { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        .tv-code-verdict.pass { background: rgba(56,161,105,.12); color: #38a169; }
        .tv-code-verdict.fail { background: rgba(229,62,62,.08); color: #e53e3e; }
        .tv-code-result-list { display: flex; flex-direction: column; }
        .tv-code-result-item { padding: 8px 14px; font-size: 0.84rem; border-bottom: 1px solid var(--line); }
        .tv-code-result-item:last-child { border-bottom: none; }
        .tv-code-result-item.fail { background: rgba(229,62,62,.03); }
        .tv-code-result-item.pass { background: rgba(56,161,105,.03); }
        .tv-code-detail { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem; }
        .tv-code-detail-label { color: var(--muted); margin-right: 4px; }
        .tv-code-detail pre { display: inline; margin: 0; padding: 2px 6px; background: var(--surface-alt); border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
    </style>
    <script>
        window.ALFA_APP_BOOTSTRAP = {
            path: "{{ app_path|escapejs }}",
            testId: {{ test_id }},
            isPreview: {% if is_preview %}true{% else %}false{% endif %},
            page: "test_view"
        };
    </script>
    <script src="{% static 'main/theme.js' %}?v=20260421-3" defer></script>
    <script type="module" src="{% static 'main/test_view/app.js' %}?v=20260608-4"></script>
</head>
<body class="app-runtime-body">
<div class="tv-layout" id="tv-root">

    <header class="tv-topbar">
        <a href="/" class="tv-brand">
            <span class="brand-mark"></span>
            <span>Alfa Career</span>
        </a>
        <span id="tv-test-title" class="tv-test-title"></span>
        <span id="tv-preview-badge" class="tv-preview-badge" hidden>Предпросмотр</span>
        <a id="tv-back-to-editor" href="#" class="tv-back-btn" hidden>← Вернуться в редактор</a>
        <button type="button" class="theme-toggle tv-btn" data-theme-toggle>Тема</button>
    </header>

    <div class="tv-body">
        <nav class="tv-sidebar" id="tv-sidebar"></nav>
        <main class="tv-main">
            <div class="tv-inner" id="tv-main-inner">
                <div class="tv-loading">Загрузка теста…</div>
            </div>
        </main>
    </div>

</div>
</body>
</html>
