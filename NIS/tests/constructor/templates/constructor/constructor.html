{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script>
    (function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <title>Alfa Career — Конструктор тестов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{% static 'css/career.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    window.ALFA_APP_BOOTSTRAP = {
      path: "{{ app_path|escapejs }}",
      testId: {% if test_id %}{{ test_id }}{% else %}null{% endif %},
      companyUsername: "{{ company_username|escapejs }}",
      page: "constructor"
    };
  </script>
  <script src="{% static 'main/theme.js' %}" defer></script>
  <script type="module" src="{% static 'constructor/app.js' %}?v=20260608-4"></script>
</head>
<body>
<div class="cst-layout" id="cst-root">

  <!-- Top bar -->
  <header class="cst-topbar">
    <a id="cst-back" href="#" class="cst-topbar-brand">
      <span class="brand-mark" style="width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><rect x="3.5" y="13" width="4.3" height="8" rx="1.4"/><rect x="9.85" y="8" width="4.3" height="13" rx="1.4"/><rect x="16.2" y="3" width="4.3" height="18" rx="1.4"/></svg>
      </span>
      <span>Career</span>
    </a>

    <a id="cst-back-tests" href="#" class="cst-btn" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
      Назад
    </a>

    <div style="width:1px;height:22px;background:var(--line);flex-shrink:0;"></div>

    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="9" y="3" width="13" height="13" rx="2"/><path d="M5 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1"/></svg>

    <input id="cst-title" class="cst-title-input" type="text" placeholder="Название теста" maxlength="255" autocomplete="off">

    <span id="cst-save-status" class="cst-save-status"></span>

    <button type="button" data-theme-toggle class="cst-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
    </button>
    <button type="button" id="cst-save-btn" class="cst-btn" disabled>Сохранить</button>
    <button type="button" id="cst-preview-btn" class="cst-btn" disabled>Предпросмотр</button>
    <button type="button" id="cst-publish-btn" class="cst-btn cst-btn-primary" disabled>Опубликовать</button>
  </header>

  <div class="cst-body">
    <!-- Pages sidebar -->
    <aside class="cst-sidebar">
      <div class="cst-sidebar-pages" id="cst-pages-list"></div>
      <div class="cst-sidebar-add">
        <button type="button" class="cst-add-btn" data-add="text">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Текст (Markdown)
        </button>
        <button type="button" class="cst-add-btn" data-add="quiz">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Вопрос с вариантами
        </button>
        <button type="button" class="cst-add-btn" data-add="input">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Вопрос с вводом
        </button>
        <button type="button" class="cst-add-btn" data-add="code">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Задача с кодом
        </button>
      </div>
    </aside>

    <!-- Editor -->
    <main class="cst-editor" id="cst-editor">
      <div class="cst-editor-inner" id="cst-editor-inner">
        <div class="cst-empty">Введите название теста и добавьте страницы</div>
      </div>
    </main>
  </div>

</div>
</body>
</html>
