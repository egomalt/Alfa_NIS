{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script>
        (function () {
            var storageKey = 'forum_theme';
            var theme = 'light';
            try {
                var savedTheme = localStorage.getItem(storageKey);
                if (savedTheme === 'dark' || savedTheme === 'light') {
                    theme = savedTheme;
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            } catch (error) {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <title>Alfa Career — Конструктор тестов</title>
    <link rel="stylesheet" href="{% static 'main/styles.css' %}?v=20260421-3">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .cst-layout { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .cst-topbar { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 56px; border-bottom: 1px solid var(--line); flex-shrink: 0; background: var(--bg); }
        .cst-topbar-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; text-decoration: none; color: var(--text); flex-shrink: 0; }
        .cst-topbar-sep { color: var(--muted); }
        .cst-title-input { flex: 1; background: transparent; border: none; outline: none; font-size: 1rem; font-weight: 500; color: var(--text); min-width: 0; }
        .cst-title-input::placeholder { color: var(--muted); }
        .cst-save-status { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; white-space: nowrap; }
        .cst-btn { padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--text); transition: opacity .15s; }
        .cst-btn:hover { opacity: 0.8; }
        .cst-btn-primary { background: var(--accent-bg); color: var(--accent-text); border-color: transparent; }
        .cst-btn:disabled { opacity: 0.4; cursor: default; }
        .cst-body { display: flex; flex: 1; overflow: hidden; }
        .cst-sidebar { width: 220px; flex-shrink: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
        .cst-sidebar-pages { flex: 1; overflow-y: auto; padding: 8px 0; }
        .cst-page-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-size: 0.82rem; color: var(--text); border-left: 2px solid transparent; transition: background .1s; }
        .cst-page-item:hover { background: var(--surface-alt); }
        .cst-page-item.active { border-left-color: var(--text); background: var(--surface-alt); font-weight: 500; }
        .cst-page-num { font-size: 0.72rem; color: var(--muted); width: 18px; flex-shrink: 0; text-align: right; }
        .cst-page-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cst-page-del { display: none; font-size: 0.8rem; color: var(--muted); background: none; border: none; cursor: pointer; padding: 2px 4px; }
        .cst-page-item:hover .cst-page-del { display: block; }
        .cst-sidebar-add { padding: 8px 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
        .cst-add-btn { padding: 6px 10px; font-size: 0.78rem; background: none; border: 1px dashed var(--line); border-radius: 6px; cursor: pointer; color: var(--muted); text-align: left; transition: border-color .15s, color .15s; }
        .cst-add-btn:hover { border-color: var(--text); color: var(--text); }
        .cst-editor { flex: 1; overflow-y: auto; padding: 32px; display: flex; justify-content: center; }
        .cst-editor-inner { width: 100%; max-width: 680px; }
        .cst-field { margin-bottom: 20px; }
        .cst-label { display: block; font-size: 0.78rem; font-weight: 500; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
        .cst-input, .cst-textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 0.92rem; box-sizing: border-box; font-family: inherit; }
        .cst-textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
        .cst-textarea:focus, .cst-input:focus { outline: none; border-color: var(--text); }
        .cst-section-title { font-size: 1rem; font-weight: 600; margin: 0 0 16px; }
        .cst-answers { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .cst-answer-row { display: flex; align-items: center; gap: 8px; }
        .cst-answer-check { flex-shrink: 0; width: 16px; height: 16px; cursor: pointer; }
        .cst-answer-text { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); font-size: 0.88rem; font-family: inherit; }
        .cst-answer-text:focus { outline: none; border-color: var(--text); }
        .cst-answer-del { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1rem; padding: 4px; }
        .cst-answer-del:hover { color: var(--text); }
        .cst-correct-hint { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }
        .cst-markdown-preview { padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-height: 80px; font-size: 0.9rem; line-height: 1.6; }
        .cst-markdown-preview h1, .cst-markdown-preview h2, .cst-markdown-preview h3 { margin: .5em 0; }
        .cst-markdown-preview p { margin: .4em 0; }
        .cst-preview-toggle { font-size: 0.78rem; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 8px; }
        .cst-preview-toggle:hover { color: var(--text); }
        .cst-flash { padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; background: var(--surface); border: 1px solid var(--line); margin-bottom: 16px; }
        .cst-flash.error { border-color: #e53e3e; color: #e53e3e; }
        .cst-flash.success { border-color: #38a169; color: #38a169; }
        .cst-type-badge { font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; background: var(--surface-alt); color: var(--muted); margin-bottom: 16px; display: inline-block; }
        .cst-empty { text-align: center; color: var(--muted); padding: 60px 20px; }
        .cst-tc-block { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .cst-tc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 0.82rem; color: var(--muted); }
        .cst-tc-header label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text); margin-left: auto; }
        .cst-tc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .cst-tc-fields .cst-label { margin-bottom: 4px; }
        .cst-select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 0.92rem; font-family: inherit; }
    </style>
    <script>
        window.ALFA_APP_BOOTSTRAP = {
            path: "{{ app_path|escapejs }}",
            testId: {% if test_id %}{{ test_id }}{% else %}null{% endif %},
            companyUsername: "{{ company_username|escapejs }}",
            page: "constructor"
        };
    </script>
    <script src="{% static 'main/theme.js' %}?v=20260421-3" defer></script>
    <script type="module" src="{% static 'constructor/app.js' %}?v=20260608-4"></script>
</head>
<body class="app-runtime-body">
<div class="cst-layout" id="cst-root">

    <header class="cst-topbar">
        <a id="cst-back" href="#" class="cst-topbar-brand">
            <span class="brand-mark"></span>
            <span>Alfa Career</span>
        </a>
        <span class="cst-topbar-sep">›</span>
        <a id="cst-back-tests" href="#" class="cst-btn" style="text-decoration:none;flex-shrink:0">← К тестам</a>
        <span class="cst-topbar-sep">›</span>
        <input id="cst-title" class="cst-title-input" type="text" placeholder="Название теста" maxlength="255" autocomplete="off">
        <span id="cst-save-status" class="cst-save-status"></span>
        <button type="button" class="theme-toggle cst-btn" data-theme-toggle>Тема</button>
        <button type="button" id="cst-save-btn" class="cst-btn" disabled>Сохранить</button>
        <button type="button" id="cst-preview-btn" class="cst-btn" disabled>Предпросмотр</button>
        <button type="button" id="cst-publish-btn" class="cst-btn cst-btn-primary" disabled>Опубликовать</button>
    </header>

    <div class="cst-body">
        <aside class="cst-sidebar">
            <div class="cst-sidebar-pages" id="cst-pages-list">
            </div>
            <div class="cst-sidebar-add">
                <button type="button" class="cst-add-btn" data-add="text">+ Текст (Markdown)</button>
                <button type="button" class="cst-add-btn" data-add="quiz">+ Вопрос с вариантами</button>
                <button type="button" class="cst-add-btn" data-add="input">+ Вопрос с вводом</button>
                <button type="button" class="cst-add-btn" data-add="code">+ Задача с кодом</button>
            </div>
        </aside>

        <main class="cst-editor" id="cst-editor">
            <div class="cst-editor-inner" id="cst-editor-inner">
                <div class="cst-empty">Введите название теста и добавьте страницы</div>
            </div>
        </main>
    </div>

</div>
</body>
</html>
