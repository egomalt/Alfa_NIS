{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script>
    (function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <title>Компании — Alfa Career</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{% static 'css/career.css' %}">
  <script src="{% static 'main/theme.js' %}" defer></script>
</head>
<body>

<!-- Navbar -->
<header class="cr-navbar">
  <a href="/" class="cr-brand">
    <span class="cr-brand-mark">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><rect x="3.5" y="13" width="4.3" height="8" rx="1.4"/><rect x="9.85" y="8" width="4.3" height="13" rx="1.4"/><rect x="16.2" y="3" width="4.3" height="18" rx="1.4"/></svg>
    </span>
    <span class="cr-brand-name">Career</span>
  </a>
  <nav class="cr-nav">
    <a href="/" class="cr-nav-link">Главная</a>
    <a href="/companies/" class="cr-nav-link active">Компании</a>
    <a href="/tests/" class="cr-nav-link">Тесты</a>
  </nav>
  <div class="cr-navbar-spacer"></div>
  <button type="button" data-theme-toggle class="cr-theme-btn">
    <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
    <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <div id="cl-nav">
    <a href="/authorization/signin/" class="mini-link-button">Войти</a>
  </div>
</header>

<!-- Content -->
<div class="cr-catalog-layout">
  <!-- Sidebar filter -->
  <aside class="cr-catalog-aside">
    <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="search-input" placeholder="Поиск" style="flex:1;min-width:0;border:none;background:transparent;color:var(--text);font-size:14px;outline:none;font-family:inherit;">
    </div>

    <div>
      <div class="cr-filter-label">Индустрия</div>
      <div id="industry-filters" style="display:flex;flex-direction:column;gap:2px;"></div>
    </div>

    <div class="cr-divider"></div>

    <label class="cr-toggle-row" id="verified-toggle" style="font-size:13.5px;color:var(--text-2);">
      <span>Только верифицированные</span>
      <div class="cr-toggle-track" id="verified-track">
        <div class="cr-toggle-knob"></div>
      </div>
    </label>
  </aside>

  <!-- Results -->
  <section>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <span style="font-size:13.5px;color:var(--muted);">
        <span id="result-count" style="font-family:'JetBrains Mono',monospace;color:var(--text-2);font-weight:500;">0</span> компаний
      </span>
    </div>
    <div class="cr-catalog-list" id="cl-grid">
      <div style="padding:48px;text-align:center;color:var(--muted);">Загрузка…</div>
    </div>
  </section>
</div>

<script>
(function(){
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function initial(name){return(name||'?').trim()[0].toUpperCase();}
  function testsLabel(n){
    if(n===0)return'Нет тестов';
    const m10=n%10,m100=n%100;
    if(m100>=11&&m100<=19)return`${n} тестов`;
    if(m10===1)return`${n} тест`;
    if(m10>=2&&m10<=4)return`${n} теста`;
    return`${n} тестов`;
  }

  let allCompanies=[];
  let search='';
  let verifiedOnly=false;
  let selectedIndustries=new Set();

  function renderRow(c){
    const avatarHtml=c.avatar_url?`<img src="${esc(c.avatar_url)}" alt="">`:`${esc(initial(c.name))}`;
    const metaParts=[c.industry,c.city].filter(Boolean).join(' · ');
    const verified=c.is_verified?`<span class="cr-verified-dot" title="Верифицирована"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg></span>`:'';
    return`<a href="${esc(c.profile_url)}" class="cr-catalog-row">
      <span class="cr-catalog-initial">${avatarHtml}</span>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:3px;">
          <span style="font-size:15.5px;font-weight:600;">${esc(c.name)}</span>${verified}
        </div>
        <div class="cr-catalog-meta">${esc(metaParts)}</div>
        ${c.description?`<div class="cr-catalog-desc">${esc(c.description.slice(0,120))}${c.description.length>120?'…':''}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;">
        <span class="cr-tests-count">${esc(testsLabel(c.tests_count))}</span>
        <span style="font-size:13px;font-weight:600;color:var(--brand-text);">Открыть →</span>
      </div>
    </a>`;
  }

  function filter(){
    const q=search.toLowerCase();
    let list=allCompanies;
    if(q)list=list.filter(c=>c.name.toLowerCase().includes(q)||(c.industry||'').toLowerCase().includes(q)||(c.city||'').toLowerCase().includes(q));
    if(verifiedOnly)list=list.filter(c=>c.is_verified);
    if(selectedIndustries.size)list=list.filter(c=>selectedIndustries.has(c.industry));
    document.getElementById('result-count').textContent=list.length;
    const grid=document.getElementById('cl-grid');
    if(!list.length){grid.innerHTML='<div style="padding:48px;text-align:center;color:var(--muted);">Ничего не найдено</div>';return;}
    grid.innerHTML=list.map(renderRow).join('');
  }

  function buildIndustryFilters(){
    const industries=[...new Set(allCompanies.map(c=>c.industry).filter(Boolean))].sort();
    const el=document.getElementById('industry-filters');
    if(!el)return;
    el.innerHTML=industries.map(ind=>`
      <label class="cr-filter-row" data-industry="${esc(ind)}">
        <span class="cr-filter-check" data-check="${esc(ind)}"></span>
        <span>${esc(ind)}</span>
      </label>`).join('');
    el.addEventListener('click',e=>{
      const row=e.target.closest('[data-industry]');
      if(!row)return;
      const ind=row.dataset.industry;
      if(selectedIndustries.has(ind))selectedIndustries.delete(ind);
      else selectedIndustries.add(ind);
      row.querySelector('[data-check]').classList.toggle('checked',selectedIndustries.has(ind));
      filter();
    });
  }

  async function loadUser(){
    try{
      const res=await fetch('/api/v1/auth/me/');
      const data=await res.json();
      const el=document.getElementById('cl-nav');
      if(!el)return;
      if(data.ok&&data.account){
        const a=data.account;
        const avatarInner=a.avatar?`<img src="${esc(a.avatar)}" alt="">`:`${esc(initial(a.name))}`;
        el.innerHTML=`<a href="${esc(a.profile_url)}" class="cr-user-chip">
          <div class="cr-user-avatar">${avatarInner}</div>
          <div><div class="cr-user-name">${esc(a.name||a.username)}</div>
          <div class="cr-user-role">${a.role==='company'?'Компания':'Кандидат'}</div></div>
        </a>`;
      }
    }catch(_){}
  }

  async function init(){
    loadUser();
    try{
      const res=await fetch('/api/v1/companies/');
      const data=await res.json();
      if(!data.ok){document.getElementById('cl-grid').innerHTML='<div style="padding:48px;text-align:center;color:var(--muted);">Ошибка загрузки</div>';return;}
      allCompanies=data.companies||[];
      buildIndustryFilters();
      filter();
    }catch(_){document.getElementById('cl-grid').innerHTML='<div style="padding:48px;text-align:center;color:var(--muted);">Не удалось загрузить компании</div>';}
  }

  document.getElementById('search-input').addEventListener('input',e=>{search=e.target.value;filter();});

  document.getElementById('verified-toggle').addEventListener('click',()=>{
    verifiedOnly=!verifiedOnly;
    document.getElementById('verified-track').classList.toggle('on',verifiedOnly);
    filter();
  });

  document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
</html>
