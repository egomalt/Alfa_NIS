{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<script>
  (function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();
</script>
<title id="cv-page-title">Конкурс — Career</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{% static 'css/career.css' %}">
<style>
.cv-hero { background: var(--surface); border-bottom: 1px solid var(--line); }
.cv-hero-inner { max-width: 1160px; margin: 0 auto; padding: 30px 32px 0; }
.cv-tab-btn { height: 44px; padding: 0 4px; margin-right: 24px; border: none; background: none; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2.5px solid transparent; transition: color .12s; font-family: inherit; }
.cv-tab-btn:hover { color: var(--text); }
.cv-tab-btn.active { color: var(--text); border-bottom-color: var(--brand); }
.cv-wrap { max-width: 1160px; margin: 0 auto; padding: 32px 32px 100px; display: grid; grid-template-columns: 1fr 300px; gap: 28px; align-items: start; }
.cv-panel { display: none; }
.cv-panel.active { display: block; }
.cv-doc { font-size: 15.5px; line-height: 1.8; color: var(--text-2); }
.cv-doc h2 { font-size: 19px; font-weight: 800; color: var(--text); margin: 28px 0 12px; letter-spacing: -.01em; }
.cv-doc h2:first-child { margin-top: 0; }
.cv-doc p { margin-bottom: 14px; }
.cv-doc ul { margin: 0 0 14px 20px; }
.cv-doc li { margin-bottom: 6px; }
.cv-doc code { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; background: var(--surface-2); padding: 2px 6px; border-radius: 5px; }
.cv-attach-box { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 18px 20px; margin-bottom: 24px; }
.cv-attach-file-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.cv-attach-file-row + .cv-attach-file-row { border-top: 1px solid var(--line); }
.cv-attach-file-row svg { flex-shrink: 0; color: var(--muted); }
.cv-btn-dl { height: 30px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); color: var(--text-2); font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all .12s; text-decoration: none; display: inline-flex; align-items: center; font-family: inherit; }
.cv-btn-dl:hover { border-color: var(--brand); color: var(--brand-text); }
.cv-rules-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.cv-rule-item { display: flex; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.cv-rule-item:last-child { border-bottom: none; }
.cv-rule-num { flex-shrink: 0; width: 24px; height: 24px; border-radius: 7px; background: var(--surface-2); color: var(--text-2); font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.cv-submit-card { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 24px; }
.cv-submit-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-bottom: 8px; }
.cv-submit-input { width: 100%; padding: 13px 14px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 14px; outline: none; transition: border-color .15s; margin-bottom: 16px; box-sizing: border-box; font-family: inherit; }
.cv-submit-input:focus { border-color: var(--brand); }
textarea.cv-submit-input { min-height: 120px; line-height: 1.6; resize: vertical; }
.cv-btn-submit { width: 100%; height: 44px; border: none; border-radius: 10px; background: var(--brand); color: var(--on-brand); font-size: 14.5px; font-weight: 700; cursor: pointer; transition: background .15s; font-family: inherit; }
.cv-btn-submit:hover { background: var(--brand-strong); }
.cv-btn-submit:disabled { background: var(--surface-2); color: var(--faint); cursor: not-allowed; }
.cv-file-drop { border: 2px dashed var(--line-2); border-radius: 12px; padding: 28px; text-align: center; background: var(--bg); margin-bottom: 16px; cursor: pointer; transition: border-color .15s; }
.cv-file-drop:hover { border-color: var(--brand); }
.cv-file-chip { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg); margin-bottom: 16px; }
.cv-side-card { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 18px 20px; margin-bottom: 16px; }
.cv-side-label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); margin-bottom: 12px; }
.cv-countdown { display: flex; gap: 8px; }
.cv-cd-unit { flex: 1; text-align: center; background: var(--surface-2); border-radius: 10px; padding: 10px 4px; }
.cv-cd-num { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: var(--brand-text); }
.cv-cd-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
.cv-stat-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; font-size: 13.5px; }
.cv-stat-row + .cv-stat-row { border-top: 1px solid var(--line); }
.cv-stat-row .k { color: var(--muted); }
.cv-stat-row .v { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
.cv-contact-banner { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: 1px solid var(--amber-text); border-radius: 12px; background: var(--amber-soft); margin-bottom: 18px; }
.cv-contact-banner svg { flex-shrink: 0; color: var(--amber-text); margin-top: 1px; }
.cv-limit-note { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
.cv-ms-item { display: flex; align-items: center; gap: 8px; padding: 10px 0; font-size: 13px; border-top: 1px solid var(--line); }
.cv-ms-item:first-child { border-top: none; }
.cv-modal { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 24px; }
.cv-modal.open { display: flex; }
.cv-modal-card { width: 100%; max-width: 440px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 28px; }
.cv-modal-inp { width: 100%; height: 42px; padding: 0 13px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--bg); color: var(--text); font-size: 14px; outline: none; margin-bottom: 14px; transition: border-color .15s; box-sizing: border-box; font-family: inherit; }
.cv-modal-inp:focus { border-color: var(--brand); }
</style>
<script>
  window.ALFA_APP_BOOTSTRAP = { page: "contest_view", contestId: {{ contest_id }} };
</script>
<script src="{% static 'main/theme.js' %}" defer></script>
<script src="{% static 'js/career.js' %}?v=20260613-1" defer></script>
<script type="module" src="{% static 'contests/contests_app/contest_view.js' %}?v=20260720-1"></script>
</head>
<body>

<header class="cr-navbar">
  <a href="/" class="cr-brand">
    <span class="cr-brand-mark">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><rect x="3.5" y="13" width="4.3" height="8" rx="1.4"/><rect x="9.85" y="8" width="4.3" height="13" rx="1.4"/><rect x="16.2" y="3" width="4.3" height="18" rx="1.4"/></svg>
    </span>
    <span class="cr-brand-name">Career</span>
  </a>
  <button onclick="history.back()"
    style="display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text-2);font-size:13px;cursor:pointer;font-family:inherit;"
    onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-2)'">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
    Назад
  </button>
  <div class="cr-navbar-spacer"></div>
  <button type="button" data-theme-toggle class="cr-theme-btn">
    <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
    <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <div id="cv-user-chip" data-user-chip></div>
</header>

<div class="cv-hero" id="cv-hero">
  <div class="cv-hero-inner" id="cv-hero-inner">
    <div style="padding:80px;text-align:center;color:var(--muted);">Загрузка…</div>
  </div>
</div>

<div class="cv-wrap">
  <div>
    <div class="cv-panel active" data-panel="case">
      <div id="cv-attach-box" hidden class="cv-attach-box">
        <div style="font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:12px;">Стартовые файлы</div>
        <div id="cv-attach-list"></div>
      </div>
      <div class="cv-doc" id="cv-case-content"></div>
    </div>
    <div class="cv-panel" data-panel="rules">
      <div class="cv-rules-list" id="cv-rules-list"></div>
    </div>
    <div class="cv-panel" data-panel="submit">
      <div class="cv-submit-card">
        <div id="cv-contact-banner-wrap"></div>
        <div id="cv-form-wrap"></div>
        <div id="cv-my-submissions" style="margin-top:18px;padding-top:18px;border-top:1px solid var(--line);" hidden>
          <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:10px;">Мои попытки</div>
          <div id="cv-ms-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div>
    <div class="cv-side-card" id="cv-countdown-card" hidden>
      <div class="cv-side-label">До дедлайна</div>
      <div class="cv-countdown" id="cv-countdown"></div>
      <div id="cv-deadline-date" style="font-size:13px;color:var(--text-2);margin-top:12px;text-align:center;"></div>
    </div>
    <div class="cv-side-card">
      <div class="cv-side-label">Статистика</div>
      <div id="cv-stats-rows"></div>
    </div>
    <div class="cv-side-card" id="cv-prize-card" hidden>
      <div class="cv-side-label">Приз</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="width:34px;height:34px;border-radius:9px;background:var(--amber-soft);color:var(--amber-text);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4M17 5h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4"/></svg>
        </span>
        <span id="cv-prize-text" style="font-size:13.5px;font-weight:600;"></span>
      </div>
    </div>
  </div>
</div>

<div class="cv-modal" id="cv-contact-modal">
  <div class="cv-modal-card">
    <div style="font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;">Контактная информация</div>
    <div style="font-size:13.5px;color:var(--muted);margin-bottom:20px;line-height:1.5;">Чтобы отправить решение, укажите хотя бы один способ связаться с вами — компания использует это, чтобы связаться с победителями.</div>
    <div style="font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px;">Email</div>
    <input class="cv-modal-inp" id="cv-contact-email" placeholder="you@example.com">
    <div style="font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px;">Телефон <span style="font-weight:400;color:var(--faint);">— необязательно</span></div>
    <input class="cv-modal-inp" id="cv-contact-phone" placeholder="+7 900 000-00-00">
    <div style="display:flex;gap:10px;margin-top:6px;">
      <button style="flex:1;height:42px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;" id="cv-contact-cancel">Отмена</button>
      <button style="flex:1;height:42px;border:none;border-radius:10px;background:var(--brand);color:var(--on-brand);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;" id="cv-contact-save">Сохранить</button>
    </div>
  </div>
</div>

<script>
  window.ALFA_MOD_TARGET = { type: 'contest', id: {{ contest_id }} };
</script>
<script src="{% static 'js/moderation-bar.js' %}?v=20260810-1"></script>
</body>
</html>
