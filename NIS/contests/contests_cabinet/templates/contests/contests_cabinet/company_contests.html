{% extends "cabinet/base_company.html" %}
{% load static %}
{% block title %}Конкурсы — Alfa Career{% endblock %}
{% block cabinet_styles %}
  <link rel="stylesheet"
        href="{% static 'contests/contests_cabinet/contests_cabinet.css' %}?v={{ ASSET_V }}">
{% endblock %}
{% block panel %}
  <div class="cp-page-header">
    <div>
      <div class="cp-page-title">Конкурсы</div>
      <div class="cp-page-sub">Турниры с кейсами и дедлайнами для кандидатов</div>
    </div>
    <a href="{% url 'contest_constructor_new' %}" class="cp-btn-primary">
      <svg width="14"
           height="14"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2.5"
           stroke-linecap="round">
        <path d="M12 5v14M5 12h14" />
      </svg>
      Создать конкурс
    </a>
  </div>
  <div class="cp-stats-row" id="cc-stats-row"></div>
  <div class="cr-filters">
    <button type="button" class="cr-chip active" data-f="all">Все</button>
    <button type="button" class="cr-chip" data-f="active">Активные</button>
    <button type="button" class="cr-chip" data-f="review">На проверке</button>
    <button type="button" class="cr-chip" data-f="finished">Завершённые</button>
    <button type="button" class="cr-chip" data-f="draft">Черновики</button>
    <span class="cr-filter-count" id="cc-filter-count"></span>
  </div>
  <div id="cc-table-wrap"></div>
{% endblock %}
{% block page_script %}
  <script type="module"
          src="{% static 'contests/contests_cabinet/company_contests.js' %}?v={{ ASSET_V }}"></script>
{% endblock %}
