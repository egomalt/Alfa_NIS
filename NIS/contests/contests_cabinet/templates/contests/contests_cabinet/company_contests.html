{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<script>
  (function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();
</script>
<title>Конкурсы — Career</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{% static 'css/career.css' %}">
<style>
.cc-layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 64px); }
.cc-sidebar { border-right: 1px solid var(--line); background: var(--surface); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; }
.cc-company-chip { display: flex; align-items: center; gap: 10px; padding: 10px 10px 18px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.cc-company-avatar { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: var(--brand-soft); color: var(--brand-text); font-weight: 700; font-size: 16px; flex-shrink: 0; }
.cc-side-link { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 10px; font-size: 13.5px; color: var(--text-2); text-decoration: none; transition: background .12s, color .12s; }
.cc-side-link:hover { background: var(--surface-2); }
.cc-side-link.active { background: var(--brand-soft); color: var(--brand-text); font-weight: 600; }
.cc-side-link svg { flex-shrink: 0; opacity: .75; }
.cc-side-link.active svg { opacity: 1; }
.cc-stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 22px; }
.cc-stat-card { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 18px 20px; }
.cc-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 4px; }
.cc-stat-label { font-size: 12.5px; color: var(--muted); }
.cc-filter-btn { height: 32px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .12s; }
.cc-filter-btn:hover { border-color: var(--brand); color: var(--brand-text); }
.cc-filter-btn.active { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.cc-table { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
.cc-thead { display: grid; grid-template-columns: 1.4fr 90px 76px 76px 90px 68px; gap: 10px; padding: 11px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.cc-thead span { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.cc-trow { display: grid; grid-template-columns: 1.4fr 90px 76px 76px 90px 68px; gap: 10px; padding: 14px 16px; align-items: center; border-bottom: 1px solid var(--line); transition: background .12s; cursor: pointer; }
.cc-trow:last-child { border-bottom: none; }
.cc-trow:hover { background: var(--surface-2); }
.cc-icon-btn { width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color .12s, border-color .12s; }
.cc-icon-btn:hover { color: var(--brand-text); border-color: var(--brand-text); }
.cc-icon-btn.danger:hover { color: var(--red-text); border-color: var(--red-text); }
.cc-empty { padding: 64px; text-align: center; border: 2px dashed var(--line-2); border-radius: 16px; }
</style>
<script>
  window.ALFA_APP_BOOTSTRAP = { username: "{{ username|escapejs }}", page: "contests" };
</script>
<script src="{% static 'main/theme.js' %}" defer></script>
<script src="{% static 'js/career.js' %}?v=20260613-1" defer></script>
<script type="module" src="{% static 'contests/contests_cabinet/company_contests.js' %}?v=20260718-1"></script>
</head>
<body>

{% include 'partials/navbar.html' with chip_id='company-user-chip' %}

<div class="cc-layout">
  {% include 'contests/contests_cabinet/_sidebar.html' with active='contests' username=username %}

  <main style="padding:28px 32px 60px;overflow-y:auto;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap;">
      <div>
        <div style="font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;">Конкурсы</div>
        <div style="font-size:14px;color:var(--muted);">Турниры с кейсами и дедлайнами для кандидатов</div>
      </div>
      <a href="/cabinet/company/contests/new/"
        style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border:none;border-radius:10px;background:var(--brand);color:var(--on-brand);font-size:14px;font-weight:600;text-decoration:none;flex-shrink:0;"
        onmouseover="this.style.background='var(--brand-strong)'" onmouseout="this.style.background='var(--brand)'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Создать конкурс
      </a>
    </div>

    <div class="cc-stats-row" id="cc-stats-row"></div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap;">
      <button class="cc-filter-btn active" data-f="all" id="ccf-all">Все</button>
      <button class="cc-filter-btn" data-f="active" id="ccf-active">Активные</button>
      <button class="cc-filter-btn" data-f="review" id="ccf-review">На проверке</button>
      <button class="cc-filter-btn" data-f="finished" id="ccf-finished">Завершённые</button>
      <button class="cc-filter-btn" data-f="draft" id="ccf-draft">Черновики</button>
      <span id="cc-filter-count" style="font-size:12px;color:var(--muted);margin-left:auto;font-family:'JetBrains Mono',monospace;"></span>
    </div>

    <div id="cc-table-wrap"></div>
  </main>
</div>

</body>
</html>
