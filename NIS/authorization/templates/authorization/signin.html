{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script>
    (function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <title>Вход — Alfa Career</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{% static 'css/career.css' %}?v={{ ASSET_V }}">
  <script>
    window.ALFA_APP_BOOTSTRAP = {
      path: "{{ app_path|escapejs }}",
      page: "signin"
    };
  </script>
  <script src="{% static 'main/theme.js' %}?v={{ ASSET_V }}" defer></script>
  <script type="module" src="{% static 'authorization/app.js' %}?v={{ ASSET_V }}"></script>
</head>
<body>
<div class="cr-auth-page">

  <a href="/" style="display:flex;align-items:center;gap:10px;margin-bottom:40px;text-decoration:none;color:var(--text);">
    <span class="cr-brand-mark">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><rect x="3.5" y="13" width="4.3" height="8" rx="1.4"/><rect x="9.85" y="8" width="4.3" height="13" rx="1.4"/><rect x="16.2" y="3" width="4.3" height="18" rx="1.4"/></svg>
    </span>
    <span style="font-weight:800;font-size:19px;letter-spacing:-.01em;">Career</span>
  </a>

  <div class="cr-auth-card">
    <h1 style="font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;">Добро пожаловать</h1>
    <p style="font-size:14px;color:var(--muted);margin:0 0 28px;">Войдите в свой аккаунт</p>

    <div id="auth-flash" class="app-alert app-alert-inline" role="alert" hidden></div>

    <form id="signin-form" method="post" action="/api/v1/auth/signin/" data-api-form="login">
      {% csrf_token %}
      <div style="display:flex;flex-direction:column;gap:16px;margin-bottom:24px;">
        <div data-field="username">
          <div class="cr-auth-field-label">Имя пользователя</div>
          <input id="login-username" aria-describedby="err-username" name="username" type="text" placeholder="ivan-sokolov"
            class="cr-auth-input" required autocapitalize="off" autocomplete="username">
          <ul class="errorlist" id="err-username" hidden></ul>
        </div>

        <div data-field="password">
          <div class="cr-auth-field-label">Пароль</div>
          <div class="cr-input-with-button">
            <input id="login-password" aria-describedby="err-password" name="password" type="password" placeholder="••••••••"
            class="cr-auth-input" required autocomplete="current-password">
            <button type="button" class="cr-eye" data-toggle-password="login-password"
              aria-label="Показать пароль" aria-pressed="false" tabindex="-1"><svg class="cr-eye-show" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg class="cr-eye-hide" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c7 0 11 7 11 7a18 18 0 0 1-3 3.8"/><path d="M6.6 6.8A18 18 0 0 0 1 12s4 7 11 7a9.9 9.9 0 0 0 4.5-1"/><path d="M2 2l20 20"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
          </div>
          <ul class="errorlist" id="err-password" hidden></ul>
        </div>
      </div>
      <button type="submit" class="cr-auth-submit">Войти</button>
    </form>

    <div style="height:1px;background:var(--line);margin:20px 0;"></div>
    <div style="text-align:center;font-size:13px;color:var(--muted);">
      Нет аккаунта?
      <a href="/authorization/signup/" style="color:var(--brand-text);font-weight:600;text-decoration:none;">Зарегистрироваться</a>
    </div>
  </div>

  <button type="button" data-theme-toggle class="theme-toggle cr-theme-float">
    <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
    <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span data-theme-label>Тёмная тема</span>
  </button>
</div>
</body>
</html>
