{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script>
        (function () {
            var storageKey = 'forum_theme';
            var theme = 'light';
            try {
                var savedTheme = localStorage.getItem(storageKey);
                if (savedTheme === 'dark' || savedTheme === 'light') {
                    theme = savedTheme;
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            } catch (error) {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <title>Alfa Career</title>
    <link rel="stylesheet" href="{% static 'main/styles.css' %}?v=20260608-4">
    <script>
        window.ALFA_APP_BOOTSTRAP = {
            path: "{{ app_path|escapejs }}",
            page: "signup"
        };
    </script>
    <script src="{% static 'main/theme.js' %}?v=20260421-3" defer></script>
    <script type="module" src="{% static 'authorization/app.js' %}?v=20260608-4"></script>
</head>
<body class="app-runtime-body">
    <div class="landing-layout single-card-layout">
        <section class="landing-form-card standalone-card">
            <div class="landing-form-inner">
                <div class="landing-form-topbar">
                    <div class="landing-top-actions">
                        <a href="/authorization/signin/" class="mini-link-button">Вход</a>
                    </div>
                    <button type="button" class="theme-toggle" data-theme-toggle>Тёмная тема</button>
                </div>

                <div class="form-intro">
                    <h2>Регистрация компании</h2>
                    <p>Укажите отображаемое имя, имя пользователя для ссылки и рабочий email, чтобы создать кабинет.</p>
                </div>

                <div class="company-only-chip">Компания</div>

                <div id="auth-flash" class="app-alert app-alert-inline" hidden></div>

                <form id="signup-form" method="post" action="/api/v1/auth/signup/" class="company-signup-form" data-api-form="register">
                    {% csrf_token %}
                    <div class="field" data-field="name">
                        <label for="register-name">Отображаемое имя</label>
                        <input id="register-name" name="name" type="text" placeholder="Например, Alfa Career" required>
                        <ul class="errorlist" hidden></ul>
                    </div>

                    <div class="field" data-field="username">
                        <label for="register-username">Имя пользователя</label>
                        <input id="register-username" name="username" type="text" placeholder="Например, alfa-career" pattern="[a-z0-9_-]+" autocapitalize="off" autocomplete="off" spellcheck="false" required>
                        <ul class="errorlist" hidden></ul>
                    </div>

                    <div class="field" data-field="email">
                        <label for="register-email">Рабочий email</label>
                        <input id="register-email" name="email" type="email" placeholder="team@company.com" required>
                        <ul class="errorlist" hidden></ul>
                    </div>

                    <button type="submit" class="dark-button full-width">Создать кабинет компании</button>
                </form>
            </div>
        </section>
    </div>
</body>
</html>
