<header class="cr-navbar">
  <a href="/" class="cr-brand">
    <span class="cr-brand-mark">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><rect x="3.5" y="13" width="4.3" height="8" rx="1.4"/><rect x="9.85" y="8" width="4.3" height="13" rx="1.4"/><rect x="16.2" y="3" width="4.3" height="18" rx="1.4"/></svg>
    </span>
    <span class="cr-brand-name">Career</span>
  </a>
  <nav class="cr-nav">
    <a href="/" class="cr-nav-link {% if active == 'home' %}active{% endif %}">Главная</a>
    <a href="/companies/" class="cr-nav-link {% if active == 'companies' %}active{% endif %}">Компании</a>
    <a href="/articles/" class="cr-nav-link {% if active == 'articles' %}active{% endif %}">Статьи</a>
    <a href="/tests/" class="cr-nav-link {% if active == 'tests' %}active{% endif %}">Тесты</a>
    <a href="/contests/" class="cr-nav-link {% if active == 'contests' %}active{% endif %}">Конкурсы</a>
  </nav>
  {% if cabinet == 'company' %}
  <div style="display:flex;align-items:center;margin-left:8px;padding-left:12px;border-left:1px solid var(--line);gap:4px;">
    <a id="nav-profile" href="#" class="cr-nav-link {% if cabinet_active == 'profile' %}active{% endif %}">Профиль</a>
    <a id="nav-tests" href="#" class="cr-nav-link {% if cabinet_active == 'tests' %}active{% endif %}">Тесты</a>
  </div>
  {% elif cabinet == 'user' %}
  <div style="display:flex;align-items:center;margin-left:8px;padding-left:12px;border-left:1px solid var(--line);gap:4px;">
    <a href="/cabinet/user/" class="cr-nav-link {% if cabinet_active == 'profile' %}active{% endif %}">Профиль</a>
    <a href="/cabinet/user/tests/" class="cr-nav-link {% if cabinet_active == 'tests' %}active{% endif %}">Тесты</a>
    <a href="/cabinet/user/articles/" class="cr-nav-link {% if cabinet_active == 'articles' %}active{% endif %}">Статьи</a>
  </div>
  {% endif %}
  <div class="cr-navbar-spacer"></div>
  <button type="button" data-theme-toggle class="cr-theme-btn">
    <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
    <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <div {% if chip_id %}id="{{ chip_id }}"{% endif %} data-user-chip></div>
  {% if logout_id %}
  <button type="button" id="{{ logout_id }}" class="cr-btn-secondary" hidden
    style="height:34px;font-size:13px;padding:0 13px;border-radius:8px;margin-left:4px;"
    onmouseover="this.style.color='var(--red-text)';this.style.borderColor='var(--red-text)'"
    onmouseout="this.style.color='';this.style.borderColor=''">Выйти</button>
  {% endif %}
</header>
