{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script>
    (function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <title>Alfa Career — Личный кабинет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{% static 'css/career.css' %}">
  <script>
    window.ALFA_APP_BOOTSTRAP = {
      username: "{{ username|escapejs }}",
      page: "candidate"
    };
  </script>
  <script src="{% static 'main/theme.js' %}" defer></script>
  <script src="{% static 'js/career.js' %}" defer></script>
  <script type="module" src="{% static 'cabinet/user.js' %}?v=20260613-2"></script>
</head>
<body>
<div style="display:flex;flex-direction:column;min-height:100vh;">

  <header class="cr-navbar">
    <a href="/" class="cr-brand">
      <span class="cr-brand-mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><rect x="3.5" y="13" width="4.3" height="8" rx="1.4"/><rect x="9.85" y="8" width="4.3" height="13" rx="1.4"/><rect x="16.2" y="3" width="4.3" height="18" rx="1.4"/></svg>
      </span>
      <span class="cr-brand-name">Career</span>
    </a>
    <nav class="cr-nav">
      <a href="/" class="cr-nav-link">Главная</a>
      <a href="/companies/" class="cr-nav-link">Компании</a>
    </nav>
    <div style="display:flex;align-items:center;height:64px;margin-left:8px;padding-left:12px;border-left:1px solid var(--line);gap:2px;">
      <a href="/cabinet/user/" class="cr-nav-link" style="font-weight:600;color:var(--text);border-bottom:2px solid var(--brand);">Профиль</a>
      <a href="/cabinet/user/tests/" class="cr-nav-link">Тесты</a>
    </div>
    <div class="cr-navbar-spacer"></div>
    <button type="button" data-theme-toggle class="cr-theme-btn">
      <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
      <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" id="cd-logout-btn" class="cr-btn-secondary" hidden>Выйти</button>
    <div id="cabinet-user-chip" data-user-chip></div>
  </header>

  <main style="flex:1;">
    <div style="max-width:1080px;margin:0 auto;padding:32px 32px 80px;">
      <div id="cd-content">
        <div style="padding:80px;text-align:center;color:var(--muted);">Загрузка профиля…</div>
      </div>
    </div>
  </main>

</div>
</body>
</html>
