{% load static %}
<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>Редактор статей — Career</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'articles_constructor/css/app.css' %}">
<script>
  (function(){
    var t = localStorage.getItem('alfa_theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.setAttribute('data-theme', 'dark');
  })();
  window.ALFA_APP_BOOTSTRAP = {
    username: "{{ username|escapejs }}",
    articleId: {{ article_id|default:"null" }},
    articleData: {{ article_json|safe }},
  };
</script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <a href="/" class="logo">
      <span class="logo-icon">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><rect x="3.5" y="13" width="4.3" height="8" rx="1.4"/><rect x="9.85" y="8" width="4.3" height="13" rx="1.4"/><rect x="16.2" y="3" width="4.3" height="18" rx="1.4"/></svg>
      </span>
      <span class="logo-text">Career</span>
    </a>
    <a href="/cabinet/user/articles/" class="btn-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
      Назад
    </a>
    <div class="divider-v"></div>
    <div class="topbar-center">
      <span class="topbar-title" id="topbar-title">Новая статья</span>
      <span class="badge-draft" id="status-badge">Черновик</span>
      <span class="topbar-meta" id="topbar-meta">0 слов</span>
    </div>
    <div class="topbar-actions">
      <a class="btn" id="btn-preview" {% if article_id %}href="/cabinet/user/articles/{{ article_id }}/preview/" target="_blank"{% else %}style="opacity:.4;pointer-events:none;"{% endif %}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Предпросмотр
      </a>
      <button class="btn-save" id="btn-save" onclick="doSave()">Сохранить</button>
      <button class="btn-publish" id="btn-publish" onclick="doPublish()">Опубликовать</button>
      <button class="btn-theme" data-theme-toggle>
        <svg class="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
        <svg class="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="body">

    <div class="editor-area" id="editor-area">
      <div class="editor-inner">

        <div id="cover-zone">
          <div class="cover-placeholder" id="cover-placeholder" onclick="addCover()">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 16l5-5 4 4 3-3 4 4"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
            <span class="cover-placeholder-text">Добавить обложку</span>
            <span class="cover-placeholder-sub">Выберите цвет градиента</span>
          </div>
          <div id="cover-set-area" style="display:none;">
            <div class="cover-set" id="cover-set">
              <div class="cover-set-bg" id="cover-bg"></div>
              <svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;opacity:.1;">
                <circle cx="580" cy="50" r="110" fill="#fff"/><circle cx="620" cy="190" r="140" fill="#fff"/><circle cx="80" cy="200" r="80" fill="#fff"/>
              </svg>
              <button class="cover-change-btn" onclick="cycleCover()">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
                Изменить
              </button>
              <button class="cover-remove-btn" onclick="removeCover()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </div>
        </div>

        <textarea class="title-input" id="title-input" placeholder="Заголовок статьи..." rows="1" oninput="onTitleInput(this)"></textarea>
        <textarea class="lead-input" id="lead-input" placeholder="Краткое описание — появится в карточке превью..." rows="1" oninput="autoResize(this)"></textarea>

        <div class="divider">
          <div class="divider-line"></div>
          <svg class="divider-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <div class="divider-line"></div>
        </div>

        <div class="body-editor" id="body-editor" contenteditable="true"
          data-placeholder="Начните писать статью...

Выделите текст — появится панель инструментов."></div>

      </div>
    </div>

    <aside class="settings">

      <div class="sp-section">
        <div class="sp-title">Теги</div>
        <div class="tags-wrap" id="tags-wrap"></div>
        <input class="tag-input" id="tag-input" placeholder="Добавить тег..." maxlength="24" onkeydown="handleTagInput(event)">
        <div class="tag-hint">Нажмите Enter, чтобы добавить</div>
      </div>

      <div class="sp-section">
        <div class="sp-title">Категория</div>
        <div class="sp-select-wrap">
          <select id="category-select">
            <option>Frontend</option>
            <option>Backend</option>
            <option>DevOps</option>
            <option>Карьера</option>
            <option>Аналитика</option>
            <option>Дизайн</option>
            <option>Другое</option>
          </select>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>

      <div class="sp-section">
        <div class="sp-title">Статистика</div>
        <div class="sp-stats">
          <div class="sp-stat">
            <div class="sp-stat-val" id="stat-words">0</div>
            <div class="sp-stat-label">слов</div>
          </div>
          <div class="sp-stat">
            <div class="sp-stat-val" id="stat-readtime">0</div>
            <div class="sp-stat-label">мин. чтения</div>
          </div>
          <div class="sp-stat">
            <div class="sp-stat-val" id="stat-chars">0</div>
            <div class="sp-stat-label">символов</div>
          </div>
          <div class="sp-stat">
            <div class="sp-stat-val" id="stat-paragraphs">0</div>
            <div class="sp-stat-label">абзацев</div>
          </div>
        </div>
      </div>


    </aside>
  </div>
</div>

<div class="floating-toolbar" id="floating-toolbar">
  <button class="ft-btn" onclick="fmt('bold')"><strong>B</strong></button>
  <button class="ft-btn" onclick="fmt('italic')"><em>I</em></button>
  <div class="ft-sep"></div>
  <button class="ft-btn" onclick="fmtBlock('h2')" style="font-size:12px;font-weight:700;">H2</button>
  <button class="ft-btn" onclick="fmtBlock('h3')" style="font-size:12px;font-weight:700;">H3</button>
  <div class="ft-sep"></div>
  <button class="ft-btn" onclick="fmtBlock('blockquote')">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg>
  </button>
  <button class="ft-btn mono" onclick="fmt('code')">&lt;/&gt;</button>
  <div class="ft-sep"></div>
  <button class="ft-btn" onclick="fmtLink()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
  </button>
</div>

<script src="{% static 'main/theme.js' %}" defer></script>
<script src="{% static 'articles_constructor/app.js' %}"></script>
</body>
</html>
