{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script>
    (function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <title>Alfa Career — Мои статьи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{% static 'css/career.css' %}">
  <style>
    /* Stats row */
    .art-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 28px; }
    .art-stat { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .art-stat-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
    .art-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: var(--text); }
    .art-stat-sub { font-size: 12px; color: var(--muted); }

    /* Filters */
    .art-filters { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
    .art-filter-btn { height: 32px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .12s; font-family: inherit; }
    .art-filter-btn:hover { border-color: var(--brand); color: var(--brand-text); }
    .art-filter-btn.active { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
    .art-filter-count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); margin-left: auto; }

    /* Grid */
    .art-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; }

    /* Card */
    .art-card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: border-color .15s, box-shadow .15s, transform .18s; cursor: pointer; text-decoration: none; color: inherit; }
    .art-card:hover { border-color: var(--line-2); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .art-cover { position: relative; height: 190px; overflow: hidden; flex-shrink: 0; }
    .art-cover-actions { position: absolute; top: 12px; right: 14px; display: flex; gap: 6px; opacity: 0; transition: opacity .15s; }
    .art-card:hover .art-cover-actions { opacity: 1; }
    .art-cover-btn { height: 30px; padding: 0 11px; border: 1px solid rgba(255,255,255,.25); border-radius: 7px; background: rgba(0,0,0,.35); color: #fff; font-size: 12px; font-weight: 500; cursor: pointer; backdrop-filter: blur(4px); transition: background .15s; display: inline-flex; align-items: center; gap: 5px; font-family: inherit; }
    .art-cover-btn:hover { background: rgba(0,0,0,.55); }
    .art-status { position: absolute; top: 14px; left: 16px; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; letter-spacing: .03em; }
    .art-status.published { background: rgba(21,147,90,.22); color: #5fcf97; border: 1px solid rgba(95,207,151,.25); }
    .art-status.draft { background: rgba(183,119,12,.22); color: #f0c070; border: 1px solid rgba(240,192,112,.25); }
    .art-body { display: flex; flex-direction: column; padding: 20px 22px 18px; flex: 1; }
    .art-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .art-tag { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); }
    .art-title { font-size: 16.5px; font-weight: 700; line-height: 1.35; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .art-excerpt { font-size: 13.5px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .art-footer { display: flex; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
    .art-meta { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
    .art-meta-mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 3px; }
    .art-meta-dot { color: var(--faint); font-size: 12px; }
    .art-footer-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .art-stat-pill { display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--faint); }

    /* Header */
    .art-page-back { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--text-2); font-size: 13px; cursor: pointer; text-decoration: none; transition: color .15s; margin-bottom: 12px; font-family: inherit; }
    .art-page-back:hover { color: var(--text); }
    .art-page-title { font-size: 28px; font-weight: 800; letter-spacing: -.025em; margin-bottom: 4px; }
    .art-page-sub { font-size: 15px; color: var(--muted); }
    .art-btn-create { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border: none; border-radius: 10px; background: var(--brand); color: var(--on-brand); font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; flex-shrink: 0; margin-top: 2px; font-family: inherit; text-decoration: none; }
    .art-btn-create:hover { background: var(--brand-strong); }

    /* Empty */
    .art-empty { grid-column: 1/-1; padding: 64px; text-align: center; border: 2px dashed var(--line-2); border-radius: 18px; }
    .art-empty-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .art-empty-sub { font-size: 14px; color: var(--muted); margin-bottom: 22px; }
  </style>
  <script>
    window.ALFA_APP_BOOTSTRAP = { username: "{{ username|escapejs }}" };
  </script>
  <script src="{% static 'main/theme.js' %}" defer></script>
  <script src="{% static 'js/career.js' %}" defer></script>
  <script type="module" src="{% static 'articles/app.js' %}?v=20260613-1"></script>
</head>
<body>
<div style="display:flex;flex-direction:column;min-height:100vh;">

  <header class="cr-navbar">
    <a href="/" class="cr-brand">
      <span class="cr-brand-mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><rect x="3.5" y="13" width="4.3" height="8" rx="1.4"/><rect x="9.85" y="8" width="4.3" height="13" rx="1.4"/><rect x="16.2" y="3" width="4.3" height="18" rx="1.4"/></svg>
      </span>
      <span class="cr-brand-name">Career</span>
    </a>
    <nav class="cr-nav">
      <a href="/" class="cr-nav-link">Главная</a>
      <a href="/companies/" class="cr-nav-link">Компании</a>
      <a href="/tests/" class="cr-nav-link">Тесты</a>
    </nav>
    <div style="display:flex;align-items:center;height:64px;margin-left:8px;padding-left:12px;border-left:1px solid var(--line);gap:2px;">
      <a href="/cabinet/user/" class="cr-nav-link">Профиль</a>
      <a href="/cabinet/user/tests/" class="cr-nav-link">Тесты</a>
      <a href="/cabinet/user/articles/" class="cr-nav-link" style="font-weight:600;color:var(--text);border-bottom:2px solid var(--brand);">Статьи</a>
    </div>
    <div class="cr-navbar-spacer"></div>
    <button type="button" data-theme-toggle class="cr-theme-btn">
      <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
      <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" id="logout-btn" class="cr-btn-secondary" hidden>Выйти</button>
    <div id="cabinet-user-chip" data-user-chip></div>
  </header>

  <main style="flex:1;">
    <div style="max-width:1060px;margin:0 auto;padding:40px 32px 80px;">

      <!-- Page header -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;gap:16px;">
        <div>
          <a href="/cabinet/user/" class="art-page-back">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
            Профиль
          </a>
          <div class="art-page-title">Мои статьи</div>
          <div class="art-page-sub">Делитесь опытом и знаниями с сообществом</div>
        </div>
        <a href="/cabinet/user/articles/new/" class="art-btn-create">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Написать статью
        </a>
      </div>

      <!-- Stats -->
      <div class="art-stats" id="art-stats">
        <div class="art-stat"><div class="art-stat-label">Опубликовано</div><div class="art-stat-value" id="stat-published">—</div><div class="art-stat-sub">статьи</div></div>
        <div class="art-stat"><div class="art-stat-label">Черновики</div><div class="art-stat-value" id="stat-drafts">—</div><div class="art-stat-sub">не опубликованы</div></div>
        <div class="art-stat"><div class="art-stat-label">Просмотры</div><div class="art-stat-value" id="stat-views">—</div><div class="art-stat-sub">за всё время</div></div>
        <div class="art-stat"><div class="art-stat-label">Реакции</div><div class="art-stat-value" id="stat-likes">—</div><div class="art-stat-sub">лайков и комментариев</div></div>
      </div>

      <!-- Filters -->
      <div class="art-filters">
        <button class="art-filter-btn active" data-filter="all">Все</button>
        <button class="art-filter-btn" data-filter="published">Опубликованные</button>
        <button class="art-filter-btn" data-filter="draft">Черновики</button>
        <span class="art-filter-count" id="art-count"></span>
      </div>

      <!-- Grid -->
      <div class="art-grid" id="art-grid">
        <div style="grid-column:1/-1;padding:80px;text-align:center;color:var(--muted);">Загрузка…</div>
      </div>

    </div>
  </main>

</div>
</body>
</html>
