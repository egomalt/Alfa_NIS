{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();</script>
  <title>Статьи — Career</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{% static 'css/career.css' %}">
  <style>
  :root { --shadow-md: 0 4px 12px rgba(16,24,40,.09), 0 12px 32px rgba(16,24,40,.11); }
  [data-theme="dark"] { --shadow-md: 0 4px 12px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.36); }
  * { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; } ::-webkit-scrollbar-track { background: transparent; }

  main { max-width: 1160px; margin: 0 auto; padding: 44px 32px 100px; }

  /* Hero */
  .hero { text-align: center; margin-bottom: 48px; }
  .hero-label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-text); font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 16px; }
  .hero-title { font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; margin-bottom: 12px; }
  .hero-sub { font-size: 16px; color: var(--muted); line-height: 1.6; }
  .search-row { display: flex; align-items: center; gap: 10px; max-width: 560px; margin: 0 auto 28px; }
  .search-wrap { flex: 1; position: relative; }
  .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--faint); }
  .search-input { width: 100%; height: 46px; padding: 0 16px 0 42px; border: 1.5px solid var(--line-2); border-radius: 12px; background: var(--surface); color: var(--text); font-size: 14.5px; font-family: inherit; outline: none; transition: border-color .15s, box-shadow .15s; }
  .search-input::placeholder { color: var(--faint); }
  .search-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .btn-write { display: inline-flex; align-items: center; gap: 7px; height: 46px; padding: 0 20px; border: none; border-radius: 12px; background: var(--brand); color: var(--on-brand); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s; font-family: inherit; text-decoration: none; }
  .btn-write:hover { background: var(--brand-strong); }

  /* Featured */
  .featured { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; margin-bottom: 40px; cursor: pointer; transition: box-shadow .2s, transform .2s; text-decoration: none; color: inherit; }
  .featured:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .featured-cover { position: relative; min-height: 340px; }
  .featured-cover-bg { position: absolute; inset: 0; }
  .featured-cover-pattern { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .1; }
  .featured-badge { position: absolute; top: 20px; left: 22px; display: flex; align-items: center; gap: 6px; padding: 5px 13px; border-radius: 999px; background: rgba(255,255,255,.18); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.25); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .featured-body { display: flex; flex-direction: column; padding: 36px 38px; justify-content: center; }
  .featured-tags { display: flex; gap: 7px; margin-bottom: 14px; flex-wrap: wrap; }
  .featured-tag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 7px; background: var(--surface-2); color: var(--text-2); }
  .featured-title { font-size: 24px; font-weight: 800; letter-spacing: -.025em; line-height: 1.3; margin-bottom: 12px; }
  .featured-excerpt { font-size: 15px; color: var(--muted); line-height: 1.7; margin-bottom: 24px; flex: 1; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .featured-meta { display: flex; align-items: center; gap: 12px; padding-top: 20px; border-top: 1px solid var(--line); }
  .author-chip { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .author-av { width: 30px; height: 30px; border-radius: 8px; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .author-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
  .author-date { font-size: 12px; color: var(--muted); }
  .featured-stats { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .stat-pill { display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--faint); }
  .read-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border: 1.5px solid var(--line-2); border-radius: 9px; background: transparent; color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; font-family: inherit; }
  .read-btn:hover { border-color: var(--brand); color: var(--brand-text); background: var(--brand-soft); }

  /* Category filters */
  .cats { display: flex; align-items: center; gap: 8px; margin-bottom: 36px; flex-wrap: wrap; }
  .cat-btn { height: 34px; padding: 0 16px; border: 1.5px solid var(--line-2); border-radius: 999px; background: var(--surface); color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .12s; white-space: nowrap; font-family: inherit; }
  .cat-btn:hover { border-color: var(--brand); color: var(--brand-text); }
  .cat-btn.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .cats-count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--faint); margin-left: auto; }

  /* Layout */
  .content-cols { display: grid; grid-template-columns: 1fr 280px; gap: 32px; align-items: start; }
  @media (max-width: 1000px) { .content-cols { grid-template-columns: 1fr; } .aside { display: none; } }

  /* Section header */
  .section-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }
  .section-title { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
  .section-count { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--faint); }

  /* Grid */
  .art-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 44px; }
  @media (max-width: 900px) { .art-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 580px) { .art-grid { grid-template-columns: 1fr; } .featured { grid-template-columns: 1fr; } }

  /* Card — точь-в-точь как в прототипе */
  .card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: border-color .15s, box-shadow .18s, transform .18s; cursor: pointer; text-decoration: none; color: inherit; }
  .card:hover { border-color: var(--line-2); box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .card-cover { position: relative; height: 180px; overflow: hidden; flex-shrink: 0; }
  .card-cover-bg { position: absolute; inset: 0; }
  .card-cover-pattern { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .1; }
  .card-body { display: flex; flex-direction: column; padding: 18px 20px 16px; flex: 1; }
  .card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 9px; }
  .tag { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); }
  .card-title { font-size: 15.5px; font-weight: 700; line-height: 1.38; margin-bottom: 7px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-excerpt { font-size: 13px; color: var(--muted); line-height: 1.65; margin-bottom: 14px; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-footer { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  .card-author { display: flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; }
  .card-av { width: 22px; height: 22px; border-radius: 6px; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--brand-soft); color: var(--brand-text); }
  .card-author-name { font-size: 12px; font-weight: 600; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px; }
  .meta-dot { color: var(--faint); font-size: 11px; }
  .meta-mono { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 3px; }
  .card-footer-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  /* Load more */
  .load-more-row { display: flex; justify-content: center; }
  .btn-load { height: 42px; padding: 0 28px; border: 1.5px solid var(--line-2); border-radius: 11px; background: var(--surface); color: var(--text-2); font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s; font-family: inherit; }
  .btn-load:hover { border-color: var(--brand); color: var(--brand-text); background: var(--brand-soft); }

  /* Sidebar */
  .aside { display: flex; flex-direction: column; gap: 20px; position: sticky; top: 80px; }
  .aside-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .aside-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); margin-bottom: 14px; }
  .trending-list { display: flex; flex-direction: column; }
  .trending-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .trending-item:last-child { border-bottom: none; padding-bottom: 0; }
  .trending-item:first-child { padding-top: 0; }
  .trending-num { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: var(--surface-3); line-height: 1; flex-shrink: 0; min-width: 24px; }
  .trending-title { font-size: 13px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .trending-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
  .cloud-tag { height: 28px; padding: 0 11px; border: 1px solid var(--line-2); border-radius: 7px; background: transparent; color: var(--text-2); font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all .12s; font-family: inherit; }
  .cloud-tag:hover { border-color: var(--brand); color: var(--brand-text); background: var(--brand-soft); }
  .cloud-tag.active { background: var(--brand); border-color: var(--brand); color: #fff; }

  /* Empty / Loading */
  .state-msg { grid-column: 1/-1; padding: 80px 20px; text-align: center; color: var(--muted); font-size: 15px; }
  </style>
  <script src="{% static 'main/theme.js' %}" defer></script>
  <script src="{% static 'js/career.js' %}?v=20260613-1" defer></script>
</head>
<body>

<header class="cr-navbar">
  <a href="/" class="cr-brand">
    <span class="cr-brand-mark">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><rect x="3.5" y="13" width="4.3" height="8" rx="1.4"/><rect x="9.85" y="8" width="4.3" height="13" rx="1.4"/><rect x="16.2" y="3" width="4.3" height="18" rx="1.4"/></svg>
    </span>
    <span class="cr-brand-name">Career</span>
  </a>
  <nav class="cr-nav">
    <a href="/" class="cr-nav-link">Главная</a>
    <a href="/companies/" class="cr-nav-link">Компании</a>
    <a href="/articles/" class="cr-nav-link active">Статьи</a>
    <a href="/tests/" class="cr-nav-link">Тесты</a>
  </nav>
  <div class="cr-navbar-spacer"></div>
  <button type="button" data-theme-toggle class="cr-theme-btn">
    <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
    <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <div id="cat-user-chip" data-user-chip>
    <a href="/authorization/signin/" class="mini-link-button">Войти</a>
    <a href="/authorization/signup/" class="mini-link-button" style="background:var(--brand);color:var(--on-brand);border-color:transparent;">Регистрация</a>
  </div>
</header>

<main>

  <!-- Hero -->
  <div class="hero">
    <div class="hero-label">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Сообщество
    </div>
    <div class="hero-title">Статьи от практиков</div>
    <div class="hero-sub">Опыт реальных разработчиков, аналитиков и менеджеров — без воды</div>
  </div>

  <!-- Featured -->
  <a class="featured" id="featured" style="display:none;" href="#">
    <div class="featured-cover" id="featured-cover">
      <div class="featured-cover-bg" id="featured-cover-bg"></div>
      <svg class="featured-cover-pattern" id="featured-cover-pattern" viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;">
        <circle cx="480" cy="60" r="160" fill="rgba(255,255,255,.08)"/>
        <circle cx="520" cy="280" r="200" fill="rgba(255,255,255,.05)"/>
        <circle cx="60" cy="300" r="100" fill="rgba(255,255,255,.04)"/>
        <circle cx="120" cy="40" r="80" fill="rgba(255,255,255,.04)"/>
      </svg>
      <div id="featured-badge" class="featured-badge">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="featured-badge-text"></span>
      </div>
    </div>
    <div class="featured-body">
      <div class="featured-tags" id="featured-tags"></div>
      <div class="featured-title" id="featured-title"></div>
      <div class="featured-excerpt" id="featured-excerpt"></div>
      <div class="featured-meta">
        <div class="author-chip">
          <div class="author-av" id="featured-author-av"></div>
          <div>
            <div class="author-name" id="featured-author-name"></div>
            <div class="author-date" id="featured-author-date"></div>
          </div>
        </div>
        <div class="featured-stats">
          <span class="stat-pill" id="featured-views">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span id="featured-views-count"></span>
          </span>
          <button class="read-btn" id="featured-read-btn">
            Читать
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </a>

  <!-- Search -->
  <div class="search-row">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input class="search-input" id="search-input" type="text" placeholder="Поиск по статьям...">
    </div>
    <a href="/cabinet/user/articles/new/" class="btn-write" id="btn-write" style="display:none;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Написать
    </a>
  </div>

  <!-- Filters -->
  <div class="cats" id="cats">
    <button class="cat-btn active" data-cat="all">Все</button>
    <span class="cats-count" id="cats-count"></span>
  </div>

  <!-- Content + Sidebar -->
  <div class="content-cols">
    <div>
      <div class="section-header">
        <div class="section-title">Последние статьи</div>
        <div class="section-count" id="art-count"></div>
      </div>
      <div class="art-grid" id="art-grid">
        <div class="state-msg">Загрузка...</div>
      </div>
      <div class="load-more-row" id="load-more-row" style="display:none;">
        <button class="btn-load" id="btn-load">Загрузить ещё</button>
      </div>
    </div>

    <aside class="aside">
      <div class="aside-card">
        <div class="aside-title">Популярное</div>
        <div class="trending-list" id="trending-list"></div>
      </div>
      <div class="aside-card" id="tags-card" style="display:none;">
        <div class="aside-title">Теги</div>
        <div class="tag-cloud" id="tag-cloud"></div>
      </div>
    </aside>
  </div>

</main>

<script>
(() => {
  const COVERS = [
    'linear-gradient(135deg,#1e3a5f 0%,#2d6a9f 100%)',
    'linear-gradient(135deg,#D62839 0%,#7a1020 100%)',
    'linear-gradient(135deg,#134e5e 0%,#1a7a6e 100%)',
    'linear-gradient(135deg,#3d1f6e 0%,#6b3fa0 100%)',
    'linear-gradient(135deg,#2d3a1a 0%,#4a7a2d 100%)',
    'linear-gradient(135deg,#5c3d00 0%,#b07000 100%)',
  ];

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function formatDate(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }); } catch { return ''; }
  }

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  let allArticles = [];
  let activeCat = 'all';
  let searchQ = '';
  let shown = 6;

  function getFiltered() {
    return allArticles.filter(a => {
      const catOk = activeCat === 'all' || (a.tags || []).includes(activeCat);
      const q = searchQ.toLowerCase();
      const qOk = !q || (a.title || '').toLowerCase().includes(q) || (a.tags || []).some(t => t.toLowerCase().includes(q));
      return catOk && qOk;
    });
  }

  function renderFeatured() {
    const top = allArticles[0];
    if (!top) return;
    const el = document.getElementById('featured');
    el.href = `/articles/${top.id}/`;
    el.style.display = '';

    const cover = COVERS[top.cover_index % COVERS.length];
    document.getElementById('featured-cover-bg').style.cssText = `position:absolute;inset:0;background:${cover};`;

    document.getElementById('featured-badge-text').textContent = (top.views || 0) + ' просмотров · Топ недели';

    document.getElementById('featured-tags').innerHTML = (top.tags || []).map(t => `<span class="featured-tag">${esc(t)}</span>`).join('');
    document.getElementById('featured-title').textContent = top.title || 'Без названия';
    document.getElementById('featured-excerpt').textContent = top.excerpt || '';

    const username = top.author_username || '?';
    const initial = username[0].toUpperCase();
    const ci = username.charCodeAt(0) % AV_COLORS.length;
    const [avBg, avFg] = AV_COLORS[ci];
    const avEl = document.getElementById('featured-author-av');
    avEl.textContent = initial;
    avEl.style.cssText = `background:${avBg};color:${avFg};`;
    document.getElementById('featured-author-name').textContent = username;
    const dateParts = [];
    if (top.published_at) dateParts.push(formatDate(top.published_at));
    if (top.read_time) dateParts.push(top.read_time + ' мин чтения');
    document.getElementById('featured-author-date').textContent = dateParts.join(' · ');

    document.getElementById('featured-views-count').textContent = top.views || 0;

    document.getElementById('featured-read-btn').onclick = (e) => {
      e.preventDefault();
      location.href = `/articles/${top.id}/`;
    };
  }

  function renderFilters() {
    const tagCounts = {};
    allArticles.forEach(a => (a.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
    const tags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).map(([t]) => t);

    const cats = document.getElementById('cats');
    const countEl = document.getElementById('cats-count');
    const existing = cats.querySelectorAll('.cat-btn');
    existing.forEach((b, i) => { if (i > 0) b.remove(); });

    tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.dataset.cat = tag;
      btn.textContent = tag;
      btn.addEventListener('click', () => filterCat(tag));
      cats.insertBefore(btn, countEl);
    });

    cats.querySelector('[data-cat="all"]').addEventListener('click', () => filterCat('all'));

    // tag cloud in sidebar
    if (tags.length) {
      document.getElementById('tags-card').style.display = '';
      document.getElementById('tag-cloud').innerHTML = tags.slice(0, 12).map(t =>
        `<button class="cloud-tag" data-tag="${esc(t)}">${esc(t)}</button>`
      ).join('');
      document.getElementById('tag-cloud').querySelectorAll('.cloud-tag').forEach(btn => {
        btn.addEventListener('click', () => filterCat(btn.dataset.tag));
      });
    }
  }

  function filterCat(cat) {
    activeCat = cat;
    shown = 6;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
    document.querySelectorAll('.cloud-tag').forEach(b => b.classList.toggle('active', b.dataset.tag === cat));
    renderGrid();
  }

  function renderTrending() {
    const top5 = [...allArticles].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 5);
    document.getElementById('trending-list').innerHTML = top5.map((a, i) => `
      <div class="trending-item" onclick="location.href='/articles/${a.id}/'">
        <div class="trending-num">0${i + 1}</div>
        <div>
          <div class="trending-title">${esc(a.title || 'Без названия')}</div>
          <div class="trending-meta">${a.views ? a.views + ' просмотров · ' : ''}${a.read_time ? a.read_time + ' мин' : ''}</div>
        </div>
      </div>`).join('');
  }

  const AV_COLORS = [
    ['#FCE7E8','#C81E2D'],['#E2F3EA','#15935A'],
    ['#EDF0F6','#3C434F'],['#FBEEDA','#B7770C'],
    ['rgba(61,31,110,.15)','#6b3fa0'],
  ];

  function renderGrid() {
    const list = getFiltered();
    const visible = list.slice(0, shown);
    const total = list.length;

    document.getElementById('cats-count').textContent = total + ' ' + plural(total, 'статья', 'статьи', 'статей');
    document.getElementById('art-count').textContent = total + ' ' + plural(total, 'статья', 'статьи', 'статей');

    const grid = document.getElementById('art-grid');
    if (!visible.length) {
      grid.innerHTML = '<div class="state-msg">Статей не найдено</div>';
      document.getElementById('load-more-row').style.display = 'none';
      return;
    }

    grid.innerHTML = visible.map(a => {
      const cover = COVERS[a.cover_index % COVERS.length];
      const username = a.author_username || '?';
      const initial = username[0].toUpperCase();
      const ci = username.charCodeAt(0) % AV_COLORS.length;
      const [avBg, avFg] = AV_COLORS[ci];
      return `
      <a class="card" href="/articles/${a.id}/">
        <div class="card-cover">
          <div class="card-cover-bg" style="background:${cover};position:absolute;inset:0;"></div>
          <svg class="card-cover-pattern" viewBox="0 0 360 180" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;">
            <circle cx="280" cy="30" r="100" fill="rgba(255,255,255,.08)"/>
            <circle cx="310" cy="160" r="130" fill="rgba(255,255,255,.05)"/>
            <circle cx="40" cy="160" r="70" fill="rgba(255,255,255,.04)"/>
          </svg>
        </div>
        <div class="card-body">
          ${(a.tags || []).length ? `<div class="card-tags">${(a.tags).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
          <div class="card-title">${esc(a.title || 'Без названия')}</div>
          <div class="card-excerpt">${esc(a.excerpt || '')}</div>
          <div class="card-footer">
            <div class="card-author">
              <div class="card-av" style="background:${avBg};color:${avFg};">${initial}</div>
              <div class="card-author-name">${esc(username)}.</div>
            </div>
            <span class="meta-dot">·</span>
            ${a.read_time ? `<span class="meta-mono"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${a.read_time} мин</span>` : ''}
            <div class="card-footer-right">
              <span class="stat-pill"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>${a.views || 0}</span>
            </div>
          </div>
        </div>
      </a>`;
    }).join('');

    document.getElementById('load-more-row').style.display = shown < total ? 'flex' : 'none';
  }

  document.getElementById('search-input').addEventListener('input', e => {
    searchQ = e.target.value;
    shown = 6;
    renderGrid();
  });

  document.getElementById('btn-load').addEventListener('click', () => {
    shown += 6;
    renderGrid();
  });

  async function init() {
    try {
      const res = await fetch('/api/v1/articles/catalog/');
      const data = await res.json();
      if (!data.ok) throw new Error();
      allArticles = data.articles || [];
      if (allArticles.length) {
        renderFeatured();
        renderFilters();
        renderTrending();
      }
      renderGrid();
    } catch {
      document.getElementById('art-grid').innerHTML = '<div class="state-msg">Не удалось загрузить статьи</div>';
    }
  }

  init();
})();
</script>
</body>
</html>
