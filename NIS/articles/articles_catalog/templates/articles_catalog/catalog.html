{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();</script>
  <title>Статьи — Career</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{% static 'css/career.css' %}">
  <link rel="stylesheet" href="{% static 'articles_catalog/css/app.css' %}">
  <script src="{% static 'main/theme.js' %}" defer></script>
  <script src="{% static 'js/career.js' %}?v=20260613-1" defer></script>
  <script src="{% static 'articles_catalog/js/app.js' %}" defer></script>
</head>
<body>

<header class="cr-navbar">
  <a href="/" class="cr-brand">
    <span class="cr-brand-mark">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><rect x="3.5" y="13" width="4.3" height="8" rx="1.4"/><rect x="9.85" y="8" width="4.3" height="13" rx="1.4"/><rect x="16.2" y="3" width="4.3" height="18" rx="1.4"/></svg>
    </span>
    <span class="cr-brand-name">Career</span>
  </a>
  <nav class="cr-nav">
    <a href="/" class="cr-nav-link">Главная</a>
    <a href="/companies/" class="cr-nav-link">Компании</a>
    <a href="/articles/" class="cr-nav-link active">Статьи</a>
    <a href="/tests/" class="cr-nav-link">Тесты</a>
  </nav>
  <div class="cr-navbar-spacer"></div>
  <button type="button" data-theme-toggle class="cr-theme-btn">
    <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
    <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <div id="cat-user-chip" data-user-chip>
    <a href="/authorization/signin/" class="mini-link-button">Войти</a>
    <a href="/authorization/signup/" class="mini-link-button" style="background:var(--brand);color:var(--on-brand);border-color:transparent;">Регистрация</a>
  </div>
</header>

<main>

  <div class="hero">
    <div class="hero-label">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Сообщество
    </div>
    <div class="hero-title">Статьи от пользователей</div>
    <div class="hero-sub">Опыт реальных разработчиков, аналитиков и менеджеров</div>
  </div>

  <a class="featured" id="featured" style="display:none;" href="#">
    <div class="featured-cover" id="featured-cover">
      <div class="featured-cover-bg" id="featured-cover-bg"></div>
      <svg class="featured-cover-pattern" id="featured-cover-pattern" viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;">
        <circle cx="480" cy="60" r="160" fill="rgba(255,255,255,.08)"/>
        <circle cx="520" cy="280" r="200" fill="rgba(255,255,255,.05)"/>
        <circle cx="60" cy="300" r="100" fill="rgba(255,255,255,.04)"/>
        <circle cx="120" cy="40" r="80" fill="rgba(255,255,255,.04)"/>
      </svg>
      <div id="featured-badge" class="featured-badge">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="featured-badge-text"></span>
      </div>
    </div>
    <div class="featured-body">
      <div class="featured-tags" id="featured-tags"></div>
      <div class="featured-title" id="featured-title"></div>
      <div class="featured-excerpt" id="featured-excerpt"></div>
      <div class="featured-meta">
        <div class="author-chip">
          <div class="author-av" id="featured-author-av"></div>
          <div>
            <div class="author-name" id="featured-author-name"></div>
            <div class="author-date" id="featured-author-date"></div>
          </div>
        </div>
        <div class="featured-stats">
          <span class="stat-pill" id="featured-views">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span id="featured-views-count"></span>
          </span>
          <button class="read-btn" id="featured-read-btn">
            Читать
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </a>

  <div class="search-row">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input class="search-input" id="search-input" type="text" placeholder="Поиск по статьям...">
    </div>
    <a href="/cabinet/user/articles/new/" class="btn-write" id="btn-write" style="display:none;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Написать
    </a>
  </div>

  <div class="cats" id="cats">
    <button class="cat-btn active" data-cat="all">Все</button>
    <span class="cats-count" id="cats-count"></span>
  </div>

  <div class="content-cols">
    <div>
      <div class="section-header">
        <div class="section-title">Последние статьи</div>
        <div class="section-count" id="art-count"></div>
      </div>
      <div class="art-grid" id="art-grid">
        <div class="state-msg">Загрузка...</div>
      </div>
      <div class="load-more-row" id="load-more-row" style="display:none;">
        <button class="btn-load" id="btn-load">Загрузить ещё</button>
      </div>
    </div>

    <aside class="aside">
      <div class="aside-card">
        <div class="aside-title">Популярное</div>
        <div class="trending-list" id="trending-list"></div>
      </div>
      <div class="aside-card" id="tags-card" style="display:none;">
        <div class="aside-title">Теги</div>
        <div class="tag-cloud" id="tag-cloud"></div>
      </div>
    </aside>
  </div>

</main>

</body>
</html>
