{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script>
    (function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <title>Alfa Career — Мои статьи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{% static 'css/career.css' %}">
  <link rel="stylesheet" href="{% static 'articles_cabinet/css/app.css' %}">
  <script>
    window.ALFA_APP_BOOTSTRAP = { username: "{{ username|escapejs }}" };
  </script>
  <script src="{% static 'main/theme.js' %}" defer></script>
  <script src="{% static 'js/career.js' %}?v=20260613-1" defer></script>
  <script type="module" src="{% static 'articles_cabinet/app.js' %}"></script>
</head>
<body>
<div style="display:flex;flex-direction:column;min-height:100vh;">

  <header class="cr-navbar">
    <a href="/" class="cr-brand">
      <span class="cr-brand-mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><rect x="3.5" y="13" width="4.3" height="8" rx="1.4"/><rect x="9.85" y="8" width="4.3" height="13" rx="1.4"/><rect x="16.2" y="3" width="4.3" height="18" rx="1.4"/></svg>
      </span>
      <span class="cr-brand-name">Career</span>
    </a>
    <nav class="cr-nav">
      <a href="/" class="cr-nav-link">Главная</a>
      <a href="/companies/" class="cr-nav-link">Компании</a>
      <a href="/articles/" class="cr-nav-link">Статьи</a>
      <a href="/tests/" class="cr-nav-link">Тесты</a>
    </nav>
    <div style="display:flex;align-items:center;margin-left:8px;padding-left:12px;border-left:1px solid var(--line);gap:4px;">
      <a href="/cabinet/user/" class="cr-nav-link">Профиль</a>
      <a href="/cabinet/user/tests/" class="cr-nav-link">Тесты</a>
      <a href="/cabinet/user/articles/" class="cr-nav-link active">Статьи</a>
    </div>
    <div class="cr-navbar-spacer"></div>
    <button type="button" data-theme-toggle class="cr-theme-btn">
      <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
      <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" id="logout-btn" class="cr-btn-secondary" hidden>Выйти</button>
    <div id="cabinet-user-chip" data-user-chip></div>
  </header>

  <main style="flex:1;">
    <div style="max-width:1060px;margin:0 auto;padding:40px 32px 80px;">

      <!-- Page header -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;gap:16px;">
        <div>
          <a href="/cabinet/user/" class="art-page-back">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
            Профиль
          </a>
          <div class="art-page-title">Мои статьи</div>
          <div class="art-page-sub">Делитесь опытом и знаниями с сообществом</div>
        </div>
        <a href="/cabinet/user/articles/new/" class="art-btn-create">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Написать статью
        </a>
      </div>

      <!-- Stats -->
      <div class="art-stats" id="art-stats">
        <div class="art-stat"><div class="art-stat-label">Опубликовано</div><div class="art-stat-value" id="stat-published">—</div><div class="art-stat-sub">статьи</div></div>
        <div class="art-stat"><div class="art-stat-label">Черновики</div><div class="art-stat-value" id="stat-drafts">—</div><div class="art-stat-sub">не опубликованы</div></div>
        <div class="art-stat"><div class="art-stat-label">Просмотры</div><div class="art-stat-value" id="stat-views">—</div><div class="art-stat-sub">за всё время</div></div>
        <div class="art-stat"><div class="art-stat-label">Реакции</div><div class="art-stat-value" id="stat-likes">—</div><div class="art-stat-sub">лайков и комментариев</div></div>
      </div>

      <!-- Filters -->
      <div class="art-filters">
        <button class="art-filter-btn active" data-filter="all">Все</button>
        <button class="art-filter-btn" data-filter="published">Опубликованные</button>
        <button class="art-filter-btn" data-filter="draft">Черновики</button>
        <span class="art-filter-count" id="art-count"></span>
      </div>

      <!-- Grid -->
      <div class="art-grid" id="art-grid">
        <div style="grid-column:1/-1;padding:80px;text-align:center;color:var(--muted);">Загрузка…</div>
      </div>

    </div>
  </main>

</div>
</body>
</html>
