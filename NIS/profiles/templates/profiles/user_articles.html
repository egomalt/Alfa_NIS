{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();</script>
  <title>Публикации — Alfa Career</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{% static 'css/career.css' %}">
  <script>
    window.ALFA_APP_BOOTSTRAP = { username: "{{ username|escapejs }}" };
  </script>
  <script src="{% static 'main/theme.js' %}" defer></script>
  <script src="{% static 'js/career.js' %}?v=20260613-1" defer></script>
  <style>
    main { max-width: 1060px; margin: 0 auto; padding: 40px 32px 80px; }

    .ua-back { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text-2); font-size: 13px; cursor: pointer; margin-bottom: 16px; text-decoration: none; transition: color .12s; }
    .ua-back:hover { color: var(--text); }

    .ua-page-header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    .ua-author-av { display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 12px; background: var(--brand-soft); color: var(--brand-text); font-weight: 700; font-size: 19px; flex-shrink: 0; overflow: hidden; }
    .ua-author-av img { width: 100%; height: 100%; object-fit: cover; }
    .ua-page-title { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
    .ua-page-sub { font-size: 13.5px; color: var(--muted); }

    .ua-filters { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .ua-filter-btn { height: 32px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .12s; font-family: inherit; }
    .ua-filter-btn:hover { border-color: var(--brand); color: var(--brand-text); }
    .ua-filter-btn.active { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
    .ua-filter-count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); margin-left: auto; }

    .ua-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    @media (max-width: 700px) { .ua-grid { grid-template-columns: 1fr; } }

    .ua-card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: border-color .15s, box-shadow .15s, transform .18s; cursor: pointer; text-decoration: none; color: inherit; }
    .ua-card:hover { border-color: var(--line-2); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .ua-card-cover { height: 170px; overflow: hidden; flex-shrink: 0; position: relative; }
    .ua-card-cover-icon { position: absolute; bottom: 16px; right: 20px; opacity: .25; }
    .ua-card-body { display: flex; flex-direction: column; padding: 20px 22px 18px; flex: 1; }
    .ua-card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .ua-card-tag { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); }
    .ua-card-title { font-size: 16px; font-weight: 700; line-height: 1.35; margin-bottom: 8px; }
    .ua-card-excerpt { font-size: 13.5px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; flex: 1; }
    .ua-card-footer { display: flex; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
    .ua-card-dot { color: var(--faint); font-size: 12px; }
    .ua-card-meta { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
    .ua-card-mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 3px; }
    .ua-card-footer-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .ua-stat-pill { display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--faint); }
  </style>
</head>
<body>

{% include 'partials/navbar.html' with chip_id='profile-user-chip' %}

<main>
  <a class="ua-back" id="ua-back-link" href="#">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
    Профиль
  </a>

  <div class="ua-page-header">
    <span class="ua-author-av" id="ua-author-av">?</span>
    <div>
      <div class="ua-page-title" id="ua-page-title">Публикации</div>
      <div class="ua-page-sub" id="ua-page-sub">Загрузка…</div>
    </div>
  </div>

  <div class="ua-filters" id="ua-filters">
    <button class="ua-filter-btn active" data-tag="all">Все</button>
    <span class="ua-filter-count" id="ua-count"></span>
  </div>

  <div class="ua-grid" id="ua-grid">
    <div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--muted);">Загрузка…</div>
  </div>
</main>

<script src="{% static 'profiles/user_articles.js' %}?v=20260722-1"></script>
</body>
</html>
