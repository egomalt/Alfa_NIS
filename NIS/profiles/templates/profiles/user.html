{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var k='alfa_theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}document.documentElement.setAttribute('data-theme',t);})();</script>
  <title>Профиль кандидата — Alfa Career</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{% static 'css/career.css' %}">
  <script>
    window.ALFA_APP_BOOTSTRAP = { username: "{{ username|escapejs }}", type: "user" };
  </script>
  <script src="{% static 'main/theme.js' %}" defer></script>
  <script src="{% static 'js/career.js' %}?v=20260613-1" defer></script>
  <style>
    main { max-width: 980px; margin: 0 auto; padding: 32px 32px 80px; }

    .pu-cover { height: 150px; border-radius: 20px 20px 0 0; background: linear-gradient(135deg,#1e3a5f 0%,#2d6a9f 100%); position: relative; overflow: hidden; }
    .pu-cover svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .5; }
    .pu-hero-card { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 22px; }
    .pu-hero-body { padding: 0 30px 26px; }
    .pu-hero-av { width: 92px; height: 92px; border-radius: 22px; background: var(--brand-soft); color: var(--brand-text); font-weight: 800; font-size: 36px; display: flex; align-items: center; justify-content: center; border: 4px solid var(--surface); margin-top: -46px; margin-bottom: 14px; overflow: hidden; flex-shrink: 0; }
    .pu-hero-av img { width: 100%; height: 100%; object-fit: cover; }
    .pu-hero-name { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 4px; }
    .pu-hero-meta { font-size: 14px; color: var(--muted); }
    .pu-hero-bio { font-size: 14px; line-height: 1.6; color: var(--text-2); margin-top: 16px; max-width: 640px; }
    .pu-tag-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .pu-tag { font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); }

    .pu-stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 22px; }
    .pu-stat-card { display: flex; flex-direction: column; gap: 5px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .pu-stat-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
    .pu-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; }

    .pu-section { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 24px 26px; margin-bottom: 20px; }
    .pu-section-title { font-size: 16px; font-weight: 700; margin-bottom: 18px; }
    .pu-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .pu-all-link { font-size: 13px; font-weight: 600; color: var(--brand-text); cursor: pointer; text-decoration: none; }
    .pu-all-link:hover { text-decoration: underline; }

    .pu-badge-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
    .pu-badge-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }
    .pu-badge-medal { width: 38px; height: 38px; border-radius: 10px; background: var(--amber-soft); color: var(--amber-text); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
    .pu-badge-title { font-size: 13px; font-weight: 700; line-height: 1.3; }
    .pu-badge-sub { font-size: 11.5px; color: var(--muted); }

    .pu-article-list { display: flex; flex-direction: column; gap: 10px; }
    .pu-article-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; transition: background .12s; text-decoration: none; color: inherit; }
    .pu-article-row:hover { background: var(--surface-2); }
    .pu-article-cover { width: 46px; height: 46px; border-radius: 10px; flex-shrink: 0; }
    .pu-article-title { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
    .pu-article-meta { font-size: 12.5px; color: var(--muted); }

    .pu-timeline { display: flex; flex-direction: column; gap: 4px; }
    .pu-tl-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
    .pu-tl-row:last-child { border-bottom: none; }
    .pu-tl-icon { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; }
    .pu-tl-text { font-size: 13.5px; flex: 1; }
    .pu-tl-time { font-size: 12px; color: var(--faint); white-space: nowrap; }

    .pu-empty { font-size: 13.5px; color: var(--muted); padding: 4px 0; }
  </style>
</head>
<body>

{% include 'partials/navbar.html' with chip_id='profile-user-chip' %}

<main>
  <div id="profile-content">
    <div style="padding:80px;text-align:center;color:var(--muted);">Загрузка…</div>
  </div>
</main>

<script src="{% static 'profiles/user.js' %}?v=20260722-1"></script>
</body>
</html>
