{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            var storageKey = 'forum_theme';
            var theme = 'light';
            try {
                var savedTheme = localStorage.getItem(storageKey);
                if (savedTheme === 'dark' || savedTheme === 'light') {
                    theme = savedTheme;
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            } catch (error) {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <title>Alfa Career</title>
    <link rel="stylesheet" href="{% static 'main/styles.css' %}?v=20260421-3">
    <script src="{% static 'main/theme.js' %}?v=20260421-3" defer></script>
</head>
<body class="app-runtime-body">
    <div class="home-shell">
        <header class="home-topbar">
            <a href="/" class="landing-brand home-brand"><span class="brand-mark"></span><span>Alfa Career</span></a>
            <nav class="home-nav">
                <button type="button" class="theme-toggle" data-theme-toggle>Тёмная тема</button>
            </nav>
        </header>
        <main class="home-placeholder">
            <div class="home-placeholder-card">
                <div class="eyebrow-text">Личный кабинет</div>
                <h1>@{{ username }}</h1>
                <p>Личный кабинет пользователя. Раздел находится в разработке.</p>
            </div>
        </main>
    </div>
</body>
</html>
